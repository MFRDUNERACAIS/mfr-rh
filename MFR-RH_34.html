function nJO(d1,d2,c=1){if(!d1)return 0;let n=0,cur=new Date(d1+"T12:00:00");const end=new Date((d2||d1)+"T12:00:00");while(cur<=end){if(cur.getDay()!==0&&cur.getDay()!==6)n++;cur.setDate(cur.getDate()+1);}return Math.round(n*c*2)/2;}

async function sha256(msg){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function isDimanche(ds){return new Date(ds+"T12:00:00").getDay()===0;}

// Heures théoriques d'un jour (veillée remplace si cochée)
function gHT(mid,jk){
  const p=HOR[mid];if(!p)return 0;
  const j=p.j[jk];if(!j)return 0;
  const[dm,fm,da,fa]=j;return cH(dm,fm)+cH(da,fa);
}

// ── Vue salarié ─────────────────────────────────────────────────
function rHR(){
  const {role,user,eq,heu}=A.s;
  const mb=role==="salarie"?eq.find(m=>m.id===user?.id):null;

  if(role==="salarie"&&mb){
    const prof=HOR[mb.id];
    const canSvcSpecial=isSvcSpecial(mb);

    // Jours actifs cette semaine
    const joursActifs=JK.filter(jk=>{
      const ds=getDJ(hLun,jk);
      return(prof?.j[jk]||heu.find(x=>x.mid===mb.id&&x.dt===ds))&&ds<=today2();
    });
    const tousConfirmes=joursActifs.length>0&&joursActifs.every(jk=>{
      const ds=getDJ(hLun,jk);
      return heu.find(x=>x.mid===mb.id&&x.dt===ds);
    });

    // Totaux semaine
    let totalTheo=0,totalReel=0,totalDep=0,totalRecup=0,totalSvc=0;
    JK.forEach(jk=>{
      const ds=getDJ(hLun,jk);
      const dc=heu.find(x=>x.mid===mb.id&&x.dt===ds);
      totalTheo+=gHT(mb.id,jk);
      if(dc){
        totalReel+=dc.hr||0;
        totalDep+=dc.dep||0;
        totalRecup+=dc.rc||0;
        // Ajouter services spéciaux au total
        if(dc.svcMidi)totalSvc+=CRENEAUX_SPECIAUX.svc_midi.duree;
        if(dc.svcSoir)totalSvc+=CRENEAUX_SPECIAUX.svc_soir.duree;
        if(dc.veillee)totalReel+=CRENEAUX_SPECIAUX.veillee.duree;
      }
    });

    let h=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
      <h2 style="color:#3A4425;font-size:22px;font-weight:800">⏱ Mes heures</h2>
      <div class="snav">
        <button class="btn bl bsm" id="hpv">← Sem.</button>
        <span>${fD(hLun)}</span>
        <button class="btn bl bsm" id="hnx">Sem. →</button>
      </div>
    </div>
    <div class="wbox">⚠️ Toute heure supplémentaire doit être validée en amont par la direction, sauf situation d'urgence. Les heures du dimanche sont récupérées à 1,5×.</div>
    ${prof?.note?`<div class="ibox">ℹ️ ${prof.note}</div>`:""}`;

    if(joursActifs.length>0&&!tousConfirmes){
      h+=`<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
        <button class="btn bs" id="btn-val-sem">✓ Valider toute la semaine (heures conformes)</button>
      </div>`;
    }

    // Totaux semaine
    h+=`<div style="display:grid;grid-template-columns:repeat(${canSvcSpecial?4:3},1fr);gap:8px;margin-bottom:14px">
      <div class="sc"><div class="lbl">Théorique</div><div class="val" style="color:#5C6B3A;font-size:18px">${fH(totalTheo)}</div></div>
      <div class="sc"><div class="lbl">Déclaré</div><div class="val" style="color:#1A6B9A;font-size:18px">${fH(totalReel)}</div></div>
      <div class="sc"><div class="lbl">Récup générée</div><div class="val" style="color:#B8670A;font-size:18px">${fH(totalRecup)}</div></div>
      ${canSvcSpecial?`<div class="sc"><div class="lbl">Services spéciaux</div><div class="val" style="color:#6A2A8A;font-size:18px">${fH(totalSvc)}h</div></div>`:""}
    </div>`;

    // Légende services spéciaux
    if(canSvcSpecial){
      h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;padding:10px 14px;background:#F5EAF8;border:1px solid #A060C0;border-radius:10px">
        <span style="font-size:13px;font-weight:700;color:#6A2A8A;width:100%;margin-bottom:4px">Services spéciaux disponibles pour votre poste :</span>
        <span style="font-size:13px;color:#555">🍽️ Service midi (12h00–13h30 · 1h30)</span>
        <span style="font-size:13px;color:#555;margin:0 8px">·</span>
        <span style="font-size:13px;color:#555">🌆 Service soir (17h30–19h00 · 1h30)</span>
        <span style="font-size:13px;color:#555;margin:0 8px">·</span>
        <span style="font-size:13px;color:#555">🌙 Veillée (13h30–21h00 · remplace les horaires habituels)</span>
      </div>`;
    }

    // Jours de la semaine
    JK.forEach(jk=>{
      const ds=getDJ(hLun,jk);
      const jT=prof?.j[jk];
      const hT=gHT(mb.id,jk);
      const dc=heu.find(x=>x.mid===mb.id&&x.dt===ds);
      const isPast=ds<=today2();
      const isDim=new Date(ds+"T12:00:00").getDay()===0;

      // Veillée active ce jour
      const isVeillee=dc?.veillee||false;
      const hTEffectif=isVeillee?CRENEAUX_SPECIAUX.veillee.duree:hT;

      if(!jT&&!dc&&!isDim){
        h+=`<div style="padding:10px 14px;background:#F8F6F0;border-radius:10px;opacity:.5;margin-bottom:7px;font-size:14px;color:#888">${JL[jk]} ${fD(ds)} — Repos</div>`;
        return;
      }

      const ac=dc?(dc.dep>0?(dc.st===ST.APP?"#2E7D52":dc.st===ST.REF?"#C0392B":"#B8670A"):isVeillee?"#7050B0":dc.svcMidi||dc.svcSoir?"#A060C0":"#2E7D52"):"#DDD5B8";

      h+=`<div class="card ca" style="border-left-color:${ac};margin-bottom:7px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
          <div style="flex:1">
            <div style="font-weight:700;font-size:15px;color:#3A4425;margin-bottom:5px">
              ${JL[jk]} <span style="font-size:13px;color:#888;font-weight:400">${fD(ds)}</span>
              ${isDim?`<span style="background:#FEF3E2;color:#B8670A;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px">🌞 Dimanche ×1,5</span>`:""}
              ${isVeillee?`<span style="background:#EAE0F8;color:#6A2A8A;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px">🌙 Veillée</span>`:""}
            </div>

            <!-- Horaires théoriques ou veillée -->
            ${isVeillee
              ?`<div style="font-size:14px;color:#6A2A8A;font-weight:600">🌙 Veillée : 13h30 → 21h00 = ${fH(CRENEAUX_SPECIAUX.veillee.duree)} <span style="font-size:12px;color:#888;font-weight:400">(remplace les horaires habituels)</span></div>`
              :jT?`<div style="font-size:14px;color:#555">Théorique : <strong>${jT[0]||"—"}${jT[1]?` → ${jT[1]}`:""}</strong>${jT[2]||jT[3]?` / <strong>${jT[2]||"—"}${jT[3]?` → ${jT[3]}`:""}</strong>`:""} <span style="color:#5C6B3A;font-weight:600">(${fH(hT)})</span></div>`:""
            }

            <!-- Services spéciaux cochés -->
            ${dc&&(dc.svcMidi||dc.svcSoir)?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
              ${dc.svcMidi?`<span style="background:#F5EAF8;color:#6A2A8A;border:1px solid #A060C0;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700">🍽️ Service midi 12h00–13h30</span>`:""}
              ${dc.svcSoir?`<span style="background:#F5EAF8;color:#6A2A8A;border:1px solid #A060C0;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700">🌆 Service soir 17h30–19h00</span>`:""}

            <!-- Déclaration heures -->

              ${dc.rc>0?`<span style="color:#2E7D52;font-weight:600;margin-left:8px">→ ${fH(dc.rc)} récup${isDim?" (×1,5)":""}</span>`:""}
            </div>
            ${dc.dep>0&&dc.mo?`<div style="font-size:12px;color:#888;margin-top:2px">💬 ${dc.mo}</div>`:""}
            <div style="margin-top:5px">${dc.dep>0?sBdg(dc.st):`<span style="background:#E8F5EE;color:#2E7D52;border:1.5px solid #5AAA80;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700">✓ Confirmé</span>`}</div>`:""}

          <!-- Boutons d'action -->
          <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
            ${isPast&&!dc&&(jT||isDim)?`
              <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">
                <button class="btn bs bsm" data-conf="${jk}" data-cds="${ds}">✓ Conforme</button>
                <button class="btn bw bsm" data-dpj="${jk}" data-dpd="${ds}">+ Heures sup.</button>
              </div>
              ${isDim&&!jT?`<button class="btn bw bsm" data-dpj="${jk}" data-dpd="${ds}" style="margin-top:2px">+ Heures dimanche</button>`:""}
              ${canSvcSpecial?`<div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px">
                <button class="btn" style="background:#F5EAF8;color:#6A2A8A;border:1.5px solid #A060C0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600" data-svc="${jk}" data-sds="${ds}" data-stype="svc_midi">🍽️ Svc midi</button>
                <button class="btn" style="background:#F5EAF8;color:#6A2A8A;border:1.5px solid #A060C0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600" data-svc="${jk}" data-sds="${ds}" data-stype="svc_soir">🌆 Svc soir</button>
                <button class="btn" style="background:#EAE0F8;color:#4A1A7A;border:1.5px solid #7050B0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600" data-svc="${jk}" data-sds="${ds}" data-stype="veillee">🌙 Veillée</button>
              </div>`:""}
            `:""}
            ${isPast&&dc&&canSvcSpecial&&!isVeillee?`
              <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px">
                ${!dc.svcMidi?`<button class="btn" style="background:#F5EAF8;color:#6A2A8A;border:1.5px solid #A060C0;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:600" data-add-svc="${dc.id}" data-add-type="svcMidi">+🍽️</button>`:`<button class="btn" style="background:#EEE;color:#888;border:1px solid #CCC;border-radius:8px;padding:4px 8px;font-size:11px" data-rm-svc="${dc.id}" data-rm-type="svcMidi">×🍽️</button>`}
                ${!dc.svcSoir?`<button class="btn" style="background:#F5EAF8;color:#6A2A8A;border:1.5px solid #A060C0;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:600" data-add-svc="${dc.id}" data-add-type="svcSoir">+🌆</button>`:`<button class="btn" style="background:#EEE;color:#888;border:1px solid #CCC;border-radius:8px;padding:4px 8px;font-size:11px" data-rm-svc="${dc.id}" data-rm-type="svcSoir">×🌆</button>`}
              </div>
            `:""}
            ${dc&&dc.st===ST.ATT&&dc.dep>0?`<button class="btn bl bsm" data-anh="${dc.id}">Annuler</button>`:""}
          </div>
        </div>
      </div>`;
    });

    // Solde récup
    const rcTotal=Math.max(0,(mb.ra||0)-(mb.rp||0));
    h+=`<div class="card" style="background:#EEF2E6;border-color:#5C6B3A33;margin-top:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:14px;font-weight:700;color:#3A4425">Mon solde récupération total</div>
        <div style="font-size:12px;color:#888;margin-top:2px">Heures supp. validées + veillées — récup posées</div></div>
        <div style="font-size:26px;font-weight:800;color:#5C6B3A">${fH(rcTotal*7)}</div>
      </div>
    </div>`;

    return h;
  }

  // ── Vue direction ─────────────────────────────────────────────
  const deq=A.s.eq,dheu=A.s.heu;
  const enAH=dheu.filter(x=>x.st===ST.ATT&&x.dep>0).length;

  // Regrouper par semaine et par membre
  const semaines={};
  dheu.forEach(x=>{
    const k=`${x.lun||getLun(x.dt)}_${x.mid}`;
    if(!semaines[k])semaines[k]={lun:x.lun||getLun(x.dt),mid:x.mid,nm:x.nm,sv:x.sv,jours:[]};
    semaines[k].jours.push(x);
  });
  const semsArr=Object.values(semaines).sort((a,b)=>b.lun.localeCompare(a.lun));

  let lH="";
  if(!semsArr.length)lH=`<div class="card" style="text-align:center;padding:40px"><p style="color:#888">Aucune déclaration</p></div>`;
  else semsArr.forEach(sem=>{
    const totalH=sem.jours.reduce((s,j)=>s+(j.hr||0),0);
    const totalT=sem.jours.reduce((s,j)=>s+(j.ht||0),0);
    const totalDep=sem.jours.reduce((s,j)=>s+(j.dep||0),0);
    const totalRec=sem.jours.reduce((s,j)=>s+(j.rc||0),0);
    const nbMidi=sem.jours.filter(j=>j.svcMidi).length;
    const nbSoir=sem.jours.filter(j=>j.svcSoir).length;
    const nbVeillee=sem.jours.filter(j=>j.veillee).length;
    const hasAtt=sem.jours.some(j=>j.st===ST.ATT&&j.dep>0);

    lH+=`<div class="card ca" style="border-left-color:${totalDep>0?"#B8670A":"#2E7D52"}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
            <span style="font-weight:800;font-size:15px;color:#3A4425">${sem.nm}</span>
            <span class="tsv">${sem.sv||""}</span>
            <span style="font-size:13px;color:#888">Sem. du ${fD(sem.lun)}</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-bottom:8px">
            <div style="background:#FAF7F0;border-radius:7px;padding:5px 8px;font-size:13px"><div style="color:#888;font-size:10px">THÉORIQUE</div><strong>${fH(totalT)}</strong></div>
            <div style="background:#E3F1FA;border-radius:7px;padding:5px 8px;font-size:13px"><div style="color:#888;font-size:10px">DÉCLARÉ</div><strong>${fH(totalH)}</strong></div>
            ${totalDep>0?`<div style="background:#FEF3E2;border-radius:7px;padding:5px 8px;font-size:13px"><div style="color:#888;font-size:10px">DÉPASS.</div><strong style="color:#B8670A">+${fH(totalDep)}</strong></div>`:""}
            ${totalRec>0?`<div style="background:#E8F5EE;border-radius:7px;padding:5px 8px;font-size:13px"><div style="color:#888;font-size:10px">RÉCUP</div><strong style="color:#2E7D52">${fH(totalRec)}</strong></div>`:""}
            ${nbMidi>0?`<div style="background:#F5EAF8;border-radius:7px;padding:5px 8px;font-size:13px"><div style="color:#888;font-size:10px">SVC MIDI</div><strong style="color:#6A2A8A">×${nbMidi}</strong></div>`:""}
            ${nbSoir>0?`<div style="background:#F5EAF8;border-radius:7px;padding:5px 8px;font-size:13px"><div style="color:#888;font-size:10px">SVC SOIR</div><strong style="color:#6A2A8A">×${nbSoir}</strong></div>`:""}
            ${nbVeillee>0?`<div style="background:#EAE0F8;border-radius:7px;padding:5px 8px;font-size:13px"><div style="color:#888;font-size:10px">VEILLÉES</div><strong style="color:#4A1A7A">×${nbVeillee}</strong></div>`:""}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">
            ${sem.jours.map(j=>{
              const c=j.dep>0?(j.st===ST.APP?"#2E7D52":j.st===ST.REF?"#C0392B":j.st===ST.ATT?"#B8670A":"#888"):j.veillee?"#7050B0":j.svcMidi||j.svcSoir?"#A060C0":"#5C6B3A";
              const extras=(j.svcMidi?"🍽️":"")+(j.svcSoir?"🌆":"")+(j.veillee?"🌙":"");
              return`<span style="font-size:11px;background:#F5F5F5;border:1px solid #DDD;border-radius:6px;padding:2px 8px;color:${c}">${["D","L","M","M","J","V","S"][new Date(j.dt+"T12:00:00").getDay()]}${extras} ${j.dep>0?`+${fH(j.dep)}`:fH(j.hr)}</span>`;
            }).join("")}
          </div>
        </div>
        ${hasAtt?`<div style="display:flex;flex-direction:column;gap:5px">
          <button class="btn bs bsm" data-val-sem="${sem.mid}_${sem.lun}">✓ Valider récup</button>
          <button class="btn bd bsm" data-ref-sem="${sem.mid}_${sem.lun}">✗ Refuser</button>
        </div>`:""}
      </div>
    </div>`;
  });

  return`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
    <h2 style="color:#3A4425;font-size:22px;font-weight:800">⏱ Déclarations horaires</h2>
    ${enAH>0?`<span style="background:#FEF3E2;color:#B8670A;border:1.5px solid #E8A030;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700">${enAH} dépassement${enAH>1?"s":""} à valider</span>`:""}
  </div>${lH}`;
}

function bHR(){
  const pv=document.getElementById("hpv");
  if(pv)pv.onclick=()=>{const d=new Date(hLun+"T12:00:00");d.setDate(d.getDate()-7);hLun=d.toISOString().split("T")[0];A.r();};
  const nx=document.getElementById("hnx");
  if(nx)nx.onclick=()=>{const d=new Date(hLun+"T12:00:00");d.setDate(d.getDate()+7);hLun=d.toISOString().split("T")[0];A.r();};

  const mb=A.s.eq.find(m=>m.id===A.s.user?.id);

  // Confirmer journée conforme
  document.querySelectorAll("[data-conf]").forEach(b=>{
    b.onclick=()=>{
      const jk=b.dataset.conf,ds=b.dataset.cds;if(!mb)return;
      const ht=gHT(mb.id,jk);const jT=HOR[mb.id]?.j[jk];if(!jT)return;
      const e={id:uid(),mid:mb.id,nm:`${mb.pr} ${mb.nom}`,sv:mb.sv,dt:ds,jk,
        hd:jT[0]||"",hf:jT[3]||jT[1]||"",ht,hr:ht,dep:0,rc:0,mo:"",
        st:ST.APP,cr:today2(),lun:hLun,conf:true,svcMidi:false,svcSoir:false,veillee:false};
      const l=[...A.s.heu.filter(x=>!(x.mid===mb.id&&x.dt===ds)),e];
      A.save("heu",l);A.toast("Journée confirmée ✓","success");
    };
  });

  // Valider toute la semaine
  const bvs=document.getElementById("btn-val-sem");
  if(bvs&&mb){
    bvs.onclick=()=>{
      const prof=HOR[mb.id];let newH=[...A.s.heu];
      JK.forEach(jk=>{
        const ds=getDJ(hLun,jk);if(ds>today2())return;
        const jT=prof?.j[jk];if(!jT)return;
        if(newH.find(x=>x.mid===mb.id&&x.dt===ds))return;
        const ht=gHT(mb.id,jk);
        const e={id:uid(),mid:mb.id,nm:`${mb.pr} ${mb.nom}`,sv:mb.sv,dt:ds,jk,
          hd:jT[0]||"",hf:jT[3]||jT[1]||"",ht,hr:ht,dep:0,rc:0,mo:"",
          st:ST.APP,cr:today2(),lun:hLun,conf:true,svcMidi:false,svcSoir:false,veillee:false};
        newH=[...newH.filter(x=>!(x.mid===mb.id&&x.dt===ds)),e];
      });
      A.save("heu",newH);A.toast("Semaine confirmée ✓","success");
    };
  }

  // Déclarer service spécial (svc_midi, svc_soir, veillee) sur journée non déclarée
  document.querySelectorAll("[data-svc]").forEach(b=>{
    b.onclick=()=>{
      if(!mb)return;
      const jk=b.dataset.svc,ds=b.dataset.sds,stype=b.dataset.stype;
      const cr=CRENEAUX_SPECIAUX[stype];
      const jT=HOR[mb.id]?.j[jk];
      const ht=cr.remplace?cr.duree:gHT(mb.id,jk);
      // Créer ou mettre à jour la déclaration du jour
      const existing=A.s.heu.find(x=>x.mid===mb.id&&x.dt===ds);
      if(existing){
        // Ajouter le service à une déclaration existante
        const updated={...existing,[stype==="veillee"?"veillee":stype==="svc_midi"?"svcMidi":"svcSoir"]:true};
        if(cr.remplace){updated.hd="13:30";updated.hf="21:00";updated.hr=cr.duree;updated.ht=ht;}
        const l=[...A.s.heu.filter(x=>!(x.mid===mb.id&&x.dt===ds)),updated];
        A.save("heu",l);
      } else {
        // Créer nouvelle déclaration
        const hd=cr.remplace?"13:30":(jT?jT[0]||"":"08:00");
        const hf=cr.remplace?"21:00":(jT?jT[3]||jT[1]||"":"17:30");
        const e={id:uid(),mid:mb.id,nm:`${mb.pr} ${mb.nom}`,sv:mb.sv,dt:ds,jk,
          hd,hf,ht,hr:cr.remplace?cr.duree:gHT(mb.id,jk),dep:0,rc:0,mo:"",
          st:ST.APP,cr:today2(),lun:hLun,conf:true,
          svcMidi:stype==="svc_midi",svcSoir:stype==="svc_soir",veillee:cr.remplace};
        const l=[...A.s.heu.filter(x=>!(x.mid===mb.id&&x.dt===ds)),e];
        A.save("heu",l);
      }
      A.toast(`${cr.emoji} ${cr.label} enregistré ✓`,"success");
    };
  });

  // Ajouter service à une déclaration existante
  document.querySelectorAll("[data-add-svc]").forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.addSvc,field=b.dataset.addType;
      const l=A.s.heu.map(x=>x.id===id?{...x,[field]:true}:x);
      A.save("heu",l);A.toast("Service ajouté ✓","success");
    };
  });

  // Retirer service d'une déclaration existante
  document.querySelectorAll("[data-rm-svc]").forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.rmSvc,field=b.dataset.rmType;
      const l=A.s.heu.map(x=>x.id===id?{...x,[field]:false}:x);
      A.save("heu",l);A.toast("Service retiré","warn");
    };
  });

  // Déclarer dépassement
  document.querySelectorAll("[data-dpj]").forEach(b=>{
    b.onclick=()=>{
      if(!mb)return;
      const jk=b.dataset.dpj,ds=b.dataset.dpd;
      const jT=HOR[mb.id]?.j[jk];
      A.set({modal:{ty:"dp",data:{mb,jk,ds,jT,ht:gHT(mb.id,jk),isDim:new Date(ds+"T12:00:00").getDay()===0}}});
    };
  });

  // Annuler déclaration

function bMdlDP(){
  const {mb,jk,ds,ht,isDim}=A.s.modal.data;
  const coef=isDim?1.5:1.0;

  // Calcul total heures réelles (matin + après-midi - pause)
  const calcTotal=()=>{
    const hd=document.getElementById("dphd").value;   // début journée
    const fm=document.getElementById("dpfm").value;   // fin matin
    const dp=document.getElementById("dpdp").value;   // début pause
    const fp=document.getElementById("dpfp").value;   // fin pause
    const da=document.getElementById("dpda").value;   // début après-midi
    const hf=document.getElementById("dphf").value;   // fin journée
    // Pause méridienne
    const pauseDuree=dp&&fp?cH(dp,fp):0;
    // Info pause
    const pi=document.getElementById("pause-info");
    if(pi&&dp&&fp) pi.textContent=`Pause méridienne : ${fH(pauseDuree)} (${dp} → ${fp})`;
    else if(pi) pi.textContent="";
    // Total : (début → fin) - pause
    if(!hd||!hf) return{r:0,dep:0,rc:0,pauseDuree,hd,hf,fm,dp,fp,da};
    const brut=cH(hd,hf);
    const r=Math.max(0,brut-pauseDuree);
    const dep=Math.max(0,r-ht);
    const rc=dep*coef;
    const nfo=document.getElementById("dpnfo");
    if(nfo){
      nfo.style.display="block";
      nfo.innerHTML=`Temps réel : <strong>${fH(r)}</strong>${pauseDuree>0?` (pause ${fH(pauseDuree)} déduite)`:""}${dep>0?` · Dépassement : <strong style="color:#B8670A">+${fH(dep)}</strong> · Récup : <strong>${fH(rc)}</strong>${isDim?" (×1,5)":""}`:` · <span style="color:#2E7D52">Conforme</span>`}`;
    }
    return{r,dep,rc,pauseDuree,hd,hf,fm,dp,fp,da};
  };

  ["dphd","dpfm","dpdp","dpfp","dpda","dphf"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.oninput=calcTotal;
  });
  calcTotal();

  document.getElementById("dpcn").onclick=()=>A.set({modal:null});
  document.getElementById("dpsb").onclick=()=>{
    const mo=document.getElementById("dpmo").value;
    const {r,dep,rc,pauseDuree,hd,hf,fm,dp,fp,da}=calcTotal();
    if(!hd||!hf||(!mo&&dep>0)){
      if(!mo&&dep>0){alert("Le motif est obligatoire pour tout dépassement.");return;}
      if(!hd||!hf){alert("Renseignez au minimum l'heure de début et de fin.");return;}
    }
    const e={id:uid(),mid:mb.id,nm:`${mb.pr} ${mb.nom}`,sv:mb.sv,dt:ds,jk,
      hd,hf,fm:fm||"",dp:dp||"",fp:fp||"",da:da||"",
      pauseDuree,ht,hr:r,dep,rc,coef,mo:mo||"",isDim:isDim||false,
      st:dep>0?ST.ATT:ST.APP,cr:today2(),lun:hLun,
      svcMidi:false,svcSoir:false,veillee:false};
    const l=[...A.s.heu.filter(x=>!(x.mid===mb.id&&x.dt===ds)),e];
    A.save("heu",l);A.set({modal:null});
    if(dep>0) A.toast("Déclaration envoyée ✓ — dépassement en attente de validation");
    else A.toast("Horaires enregistrés ✓","success");
  };
}

// Ponts possibles (jeudi→vendredi, mardi→lundi)
const PONTS_POSSIBLES = {};
Object.entries(JOURS_FERIES).forEach(([ds,nom])=>{
  const d=new Date(ds+"T12:00:00"),dow=d.getDay();
  if(dow===4){// jeudi → pont vendredi
    const v=new Date(d);v.setDate(v.getDate()+1);
    PONTS_POSSIBLES[v.toISOString().split("T")[0]]={nom:`Pont après ${nom}`,type:"pont"};
  } else if(dow===2){// mardi → pont lundi
    const l=new Date(d);l.setDate(l.getDate()-1);
    PONTS_POSSIBLES[l.toISOString().split("T")[0]]={nom:`Pont avant ${nom}`,type:"pont"};
  }
});

// Seuils Qualiopi
const SEUILS = {OK:80, WARN:60}; // >80% vert, 60-80% orange, <60% rouge
function getSeuilColor(pct){
  if(pct>=SEUILS.OK) return{bg:"#E8F5EE",c:"#2E7D52",b:"#5AAA80",label:"✅ Conforme"};
  if(pct>=SEUILS.WARN) return{bg:"#FEF3E2",c:"#B8670A",b:"#E8A030",label:"⚠️ Vigilance"};
  return{bg:"#FDECEA",c:"#C0392B",b:"#E08080",label:"🚨 Alerte"};
}

// Parser date dd/mm/yyyy → ISO
function parseDDMMYYYY(s){
  if(!s)return null;
  const[d,m,y]=s.split("/");
  return`${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
}

// Obtenir le planning de la semaine qui contient une date
function getPlanningForDate(dateStr, annee){
  const data=PLANNING_RAW[annee]||[];
  return data.find(row=>{
    const debut=parseDDMMYYYY(row[1]);
    const fin=parseDDMMYYYY(row[2]);
    return dateStr>=debut&&dateStr<=fin;
  })||null;
}

// Obtenir l'année scolaire courante
function getAnneeScolaireFromDate(dateStr){
  const y=parseInt(dateStr.split("-")[0]);
  const m=parseInt(dateStr.split("-")[1]);
  return m>=8?`${y}-${y+1}`:`${y-1}-${y}`;
}

// Calculer le nombre de classes présentes une semaine
function nbClassesPresentesSemaine(row){
  if(!row)return 0;
  const vals=row.slice(3,13);
  return vals.filter(v=>v&&v!=="Vac"&&v!=="Stage"&&v!=="Ent").length;
}

// Calculer le taux de présence enseignants par filière
function tauxPresenceFiliere(equipe,absences,dateStr,filiere){
  const fili=FILIERES[filiere];if(!fili)return null;
  // Récupérer les membres de cette filière (Pédagogie + filière attribuée)
  const membres=equipe.filter(m=>m.sv==="Pédagogie"&&m.filiere===filiere&&!m.archive);
  if(!membres.length)return{pct:100,present:0,absent:0,total:0};
  const absJour=absences.filter(a=>{
    if(!membres.find(m=>m.id===a.mid))return false;
    if(a.ty==="Annulée")return false;
    return a.dd<=dateStr&&(a.df||a.dd)>=dateStr;
  });
  const present=membres.length-absJour.length;
  const pct=Math.round((present/membres.length)*100);
  return{pct,present,absent:absJour.length,total:membres.length};
}

        <div style="font-size:13px;font-weight:600;color:#555">Classes présentes</div></div>
    </div>`;

    // Planning des classes cette semaine
    let planH="";
    if(planRow){
      const classesK=CLASSES_ORDER;
      planH=`<div class="card" style="margin-bottom:12px"><h3 style="font-size:16px;color:#3A4425;margin-bottom:12px">🎓 Présence des classes — Sem. ${planRow[0]}</h3>`;
      // Par filière
      Object.entries(FILIERES).forEach(([filiere,fmeta])=>{
        const clsFil=fmeta.classes;
        planH+=`<div style="margin-bottom:10px"><div style="font-size:13px;font-weight:700;color:${fmeta.color};text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:${fmeta.color};display:inline-block"></span>${filiere}</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">`;
        clsFil.forEach((clsKey,ci)=>{
          const idx=classesK.indexOf(clsKey);
          const rawVal=planRow[3+idx]||"";
          const st=normalise(rawVal);
          const cfg={P:{bg:fmeta.bg,c:fmeta.color,b:fmeta.color,ico:"✅",txt:"Présente"},
                     S:{bg:"#F5F5F5",c:"#888",b:"#CCC",ico:"🏭",txt:"Stage/Ent"},
                     V:{bg:"#F0F0F0",c:"#AAA",b:"#DDD",ico:"🌴",txt:"Vacances"}}[st];
          planH+=`<span style="background:${cfg.bg};color:${cfg.c};border:1.5px solid ${cfg.b};border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px" title="${CLASSES_META[clsKey].label}: ${cfg.txt}">${cfg.ico} ${CLASSES_META[clsKey].label}</span>`;
        });
        planH+=`</div></div>`;
      });
      planH+=`</div>`;
    }

    // Absentéisme par filière (Qualiopi)
    let absFilH=`<div class="card" style="margin-bottom:12px"><h3 style="font-size:16px;color:#3A4425;margin-bottom:12px">📊 Absentéisme formateurs — ${MOIS[parseInt(ms.split("-")[1])-1]}</h3>`;
    const pres=calcPres(eq,abs,ms);
    // Par filière pédagogique
    Object.entries(FILIERES).forEach(([filiere,fmeta])=>{
      const mbrsFil=eq.filter(m=>m.sv==="Pédagogie"&&m.filiere===filiere&&!m.archive);
      if(!mbrsFil.length){
        absFilH+=`<div style="margin-bottom:8px;opacity:.5"><div style="font-size:13px;font-weight:700;color:${fmeta.color};margin-bottom:3px">${filiere} — <span style="font-size:12px;font-weight:400">Aucun formateur assigné</span></div></div>`;
        return;
      }
      // Calculer absentéisme du mois pour cette filière
      const[y,mo]=ms.split("-").map(Number);
      const dernJ=new Date(y,mo,0);let jo=0;
      for(let d=new Date(y,mo-1,1);d<=dernJ;d.setDate(d.getDate()+1)){if(d.getDay()!==0&&d.getDay()!==6)jo++;}
      const cap=mbrsFil.length*jo;
      const dM=`${ms}-01`,fM=`${ms}-${String(dernJ.getDate()).padStart(2,"0")}`;
      let tot=0;
      abs.forEach(a=>{
        if(!mbrsFil.find(m=>m.id===a.mid)||a.ty==="Annulée")return;
        const db=a.dd>dM?a.dd:dM;const fi=(a.df||a.dd)<fM?(a.df||a.dd):fM;
        if(db<=fi)tot+=nJO(db,fi,a.cj||1);
      });
      const pct=cap>0?Math.round(((cap-tot)/cap)*100):100;
      const scfg=getSeuilColor(pct);
      absFilH+=`<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="width:10px;height:10px;border-radius:50%;background:${fmeta.color};display:inline-block"></span>
            <span style="font-size:14px;font-weight:700;color:#3A4425">${filiere}</span>
            <span style="font-size:12px;color:#888">(${mbrsFil.length} formateur${mbrsFil.length>1?"s":""})</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;background:${scfg.bg};color:${scfg.c};border:1px solid ${scfg.b};border-radius:8px;padding:2px 8px;font-weight:700">${scfg.label}</span>
            <span style="font-size:19px;font-weight:800;color:${scfg.c}">${pct}%</span>
          </div>
        </div>
        <div class="pbar"><div class="pfill" style="width:${pct}%;background:${scfg.c}"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:2px">
          <span>${mbrsFil.filter(m=>{const a=abs.find(ab=>ab.mid===m.id&&ab.ty!=="Annulée"&&ab.dd<=today2()&&(ab.df||ab.dd)>=today2());return!a;}).length} présents auj.</span>
          <span>Seuil Qualiopi : 80%</span>
        </div>
      </div>`;
    });
    // Services non pédago
    const autresSvc=["Administratif","Vie résidentielle","Direction","AESH"];
    autresSvc.forEach(sv=>{
      const d=pres[sv];if(!d)return;
      const scfg=getSeuilColor(d.pct);
      absFilH+=`<div style="margin-bottom:6px;padding:6px 10px;background:#FAF7F0;border-radius:8px;border-left:3px solid #DDD5B8;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;color:#555">${sv} (${d.nb})</span>
        <div style="display:flex;align-items:center;gap:6px">
          <div style="width:80px;height:6px;background:#EDE8D8;border-radius:3px"><div style="width:${d.pct}%;height:100%;background:${scfg.c};border-radius:3px"></div></div>
          <span style="font-size:13px;font-weight:700;color:${scfg.c}">${d.pct}%</span>
        </div>
      </div>`;
    });
    absFilH+=`</div>`;

    // Absents aujourd'hui
    let absAujH="";
    if(absAuj.length>0){
      absAujH=`<div class="card" style="margin-bottom:12px"><h3 style="font-size:16px;color:#3A4425;margin-bottom:10px">Absents aujourd'hui (${absAuj.length})</h3>
        <div style="display:flex;flex-wrap:wrap;gap:7px">`;
      absAuj.forEach(a=>{
        const mb2=eq.find(m=>m.id===a.mid);
        const fil=mb2?.filiere||mb2?.sv||"";
        absAujH+=`<div style="display:flex;align-items:center;gap:7px;background:#FAF7F0;border:1px solid #DDD5B8;border-radius:8px;padding:6px 12px">
          <span style="font-size:14px;font-weight:700">${a.nm}</span>
          ${fil?`<span style="font-size:11px;color:#888;background:#EEF2E6;border-radius:6px;padding:1px 7px">${fil}</span>`:""}
          ${tBdg(a.ty,true)}</div>`;
      });
      absAujH+=`</div></div>`;
    }

    // Prochaines semaines (anticipation)
    let anticipH=`<div class="card"><h3 style="font-size:16px;color:#3A4425;margin-bottom:12px">📅 Prochaines semaines — Classes présentes</h3>`;
    for(let s=0;s<4;s++){
      const futLundi=new Date(semLundi+"T12:00:00");futLundi.setDate(futLundi.getDate()+s*7);
      const futStr=futLundi.toISOString().split("T")[0];
      if(s===0){anticipH+=``;continue;} // semaine courante déjà affichée
      const futAS=getAnneeScolaireFromDate(futStr);
      const futRow=getPlanningForDate(futStr,futAS);
      const futN=futRow?nbClassesPresentesSemaine(futRow):0;
      const futFeries=[];
      for(let i=0;i<5;i++){const fd=new Date(futLundi);fd.setDate(fd.getDate()+i);const fds=fd.toISOString().split("T")[0];if(JOURS_FERIES[fds]||PONTS_POSSIBLES[fds])futFeries.push(JOURS_FERIES[fds]||PONTS_POSSIBLES[fds].nom);}
      const futVen=new Date(futLundi);futVen.setDate(futVen.getDate()+4);
      anticipH+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#FAF7F0;border-radius:8px;margin-bottom:5px;border-left:3px solid ${futN>5?"#2E7D52":futN>2?"#B8670A":"#CCC"}">
        <div><span style="font-size:14px;font-weight:700;color:#3A4425">Sem. ${futRow?futRow[0]:"—"}</span><span style="font-size:13px;color:#888;margin-left:8px">${fD(futStr)} → ${fD(futVen.toISOString().split("T")[0])}</span>${futFeries.length>0?`<span style="font-size:12px;color:#B8670A;margin-left:6px">🎉 ${futFeries.join(", ")}</span>`:""}</div>
        <span style="font-size:16px;font-weight:800;color:${futN>5?"#2E7D52":futN>2?"#B8670A":"#888"}">${futN}/${totalClasses} cl.</span>
      </div>`;
    }
    anticipH+=`</div>`;

    return`<h2 style="color:#3A4425;font-size:22px;font-weight:800;margin-bottom:4px">Bonjour, ${user?.pr||""} 👋</h2>
      <p style="color:#888;font-size:13px;margin-bottom:14px">Année scolaire ${getAS()} · 1er sept → 31 août</p>
      ${navH}${feriesH}${kpiH}
      <button class="btn bg" style="width:100%;margin-bottom:12px" data-nav="rc">📋 Tableau récapitulatif équipe →</button>
      ${planH}${absFilH}${absAujH}${anticipH}`;
  }

  // ── Vue salarié ────────────────────────────────────────────────
  const cp=Math.max(0,(mb?.cp||0)-(mb?.cpp||0));
  const rc=Math.max(0,(mb?.ra||0)-(mb?.rp||0));
  const tt=Math.max(0,(mb?.ttp||0)-(mb?.ttu||0));
  let mdH=`<div class="card"><h3 style="font-size:16px;color:#3A4425;margin-bottom:12px">Mes dernières demandes</h3>`;
  if(!mesD.length)mdH+=`<p style="color:#888;font-size:14px">Aucune demande — cliquez sur "+ Demande"</p>`;
  else mesD.forEach(d=>{mdH+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#FAF7F0;border:1px solid #DDD5B8;border-radius:10px;flex-wrap:wrap;gap:8px;margin-bottom:8px"><div>${tBdg(d.ty,true)}<span style="font-size:13px;color:#555;margin-left:8px">${fD(d.dd)}${d.nj>0?` · ${d.nj}j`:""}</span>${d.rp?`<div style="font-size:12px;color:${d.st===ST.APP?"#2E7D52":"#C0392B"};margin-top:2px">📩 ${d.rp}</div>`:""}</div>${sBdg(d.st)}</div>`;});
  mdH+=`</div>`;
  return`<h2 style="color:#3A4425;font-size:22px;font-weight:800;margin-bottom:4px">Bonjour, ${user?.pr||""} 👋</h2>
    <p style="color:#888;font-size:13px;margin-bottom:14px">Période : ${getAS()}</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin-bottom:14px">
      <div class="sc"><div class="lbl">CP restants</div><div class="val" style="color:#C8A84B">${cp}<span style="font-size:13px;color:#888">j</span></div></div>
      <div class="sc"><div class="lbl">Récupération</div><div class="val" style="color:#5C6B3A">${rc}<span style="font-size:13px;color:#888">j</span></div></div>
      <div class="sc"><div class="lbl">TT ce mois</div><div class="val" style="color:#1A6B9A">${hStr(tt)}</div></div>
    </div>${mdH}`;
}

// ── VUE PLANNING CLASSES ─────────────────────────────────────────
function rPLANNING_CLASSES(){
  const anneeSco=A.s.planAnneeSco||getAS()||"2025-2026";
  const data=PLANNING_RAW[anneeSco]||[];
  if(!data.length) return`<p style="color:#888">Aucune donnée pour ${anneeSco}</p>`;

  // Sélecteur année
  let selH=`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    ${["2025-2026","2026-2027"].map(a=>`<button class="btn ${a===anneeSco?"bp":"bl"} bsm" data-plan-annee="${a}">${a}</button>`).join("")}
  </div>`;

  // Tableau planning
  let tH=`<div style="overflow-x:auto;border-radius:12px;border:1px solid #DDD5B8;background:#fff">
    <table style="border-collapse:collapse;min-width:100%;font-size:13px">
      <thead>
        <tr style="background:#3A4425">
          <th style="padding:9px 12px;color:#fff;text-align:left;font-size:12px;position:sticky;left:0;background:#3A4425;z-index:2;min-width:120px">Semaine</th>
          <th style="padding:9px 8px;color:#fff;font-size:12px;min-width:100px">Dates</th>`;

  // En-têtes classes par filière
  Object.entries(FILIERES).forEach(([fil,fmeta])=>{
    fmeta.classes.forEach(clsKey=>{
      tH+=`<th style="padding:9px 5px;font-size:11px;font-weight:700;color:#fff;text-align:center;min-width:70px;border-left:1px solid rgba(255,255,255,.2)" title="${CLASSES_META[clsKey].label}">${CLASSES_META[clsKey].label}</th>`;
    });
  });
  tH+=`<th style="padding:9px 8px;color:#fff;font-size:12px;text-align:center;border-left:1px solid rgba(255,255,255,.3)">Total</th></tr>
      <!-- Sous-en-tête filières -->
      <tr style="background:#5C6B3A">
        <td colspan="2" style="padding:4px 12px;font-size:11px;color:rgba(255,255,255,.6)">Filière →</td>`;
  Object.entries(FILIERES).forEach(([fil,fmeta])=>{
    tH+=`<td colspan="${fmeta.classes.length}" style="padding:4px 5px;text-align:center;font-size:11px;font-weight:700;color:#fff;background:${fmeta.color};border-left:2px solid rgba(255,255,255,.3)">${fil}</td>`;
  });
  tH+=`<td></td></tr></thead><tbody>`;

  // Lignes semaines
  data.forEach((row,ri)=>{
    const semNum=row[0],debut=row[1],fin=row[2];
    const debutISO=parseDDMMYYYY(debut);
    const isCurrentWeek=debutISO&&debutISO<=today2()&&parseDDMMYYYY(fin)>=today2();
    const isFuture=debutISO&&debutISO>today2();
    // Jours fériés cette semaine
    const hasFeries=debutISO&&Object.keys(JOURS_FERIES).some(f=>f>=debutISO&&f<=parseDDMMYYYY(fin));
    const bgRow=isCurrentWeek?"#FBF5E0":ri%2===0?"#fff":"#FAF7F0";

    tH+=`<tr style="background:${bgRow}${isCurrentWeek?";outline:2px solid #C8A84B;outline-offset:-1px":""}" title="${isCurrentWeek?"← Semaine en cours":""}">
      <td style="padding:7px 12px;font-weight:${isCurrentWeek?"800":"600"};color:${isCurrentWeek?"#7A5A10":"#3A4425"};position:sticky;left:0;background:${bgRow};border-right:1px solid #DDD5B8">
        S${semNum}${isCurrentWeek?" ◀":""}${hasFeries?` 🎉`:""}
      </td>
      <td style="padding:7px 8px;font-size:12px;color:#555;white-space:nowrap">${debut?.split("/")[0]}/${debut?.split("/")[1]} → ${fin?.split("/")[0]}/${fin?.split("/")[1]}</td>`;

    let nbPres=0;
    CLASSES_ORDER.forEach((clsKey,ci)=>{
      const rawVal=row[3+ci]||"";
      const st=normalise(rawVal);
      if(st==="P")nbPres++;
      const fmeta=FILIERES[CLASSES_META[clsKey].filiere];
      const cfg={
        P:{bg:fmeta.bg,c:fmeta.color,ico:"✅",txt:rawVal},
        S:{bg:"#F5F5F5",c:"#888",ico:"🏭",txt:rawVal==="Ent"?"Ent.":"Stage"},
        V:{bg:"#EEE",c:"#AAA",ico:"",txt:"Vac."}
      }[st];
      tH+=`<td style="padding:4px 3px;text-align:center;border-left:1px solid #EDE8D8">
        <span style="background:${cfg.bg};color:${cfg.c};border-radius:5px;padding:2px 4px;font-size:11px;font-weight:700;white-space:nowrap">${cfg.ico} ${cfg.txt}</span>
      </td>`;
    });

    const totalColor=nbPres>=7?"#2E7D52":nbPres>=4?"#B8670A":"#C0392B";
    tH+=`<td style="padding:7px 8px;text-align:center;font-weight:800;font-size:15px;color:${totalColor};border-left:2px solid #DDD5B8">${nbPres}</td></tr>`;
  });

  tH+=`</tbody></table></div>`;

  // Légende
  let legendH=`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
    <span style="font-size:13px;color:#555">Légende :</span>
    <span style="font-size:12px;background:#EEF2E6;color:#3A4425;border-radius:6px;padding:2px 8px">✅ Présente en MFR</span>
    <span style="font-size:12px;background:#F5F5F5;color:#888;border-radius:6px;padding:2px 8px">🏭 Stage / Entreprise</span>
    <span style="font-size:12px;background:#EEE;color:#AAA;border-radius:6px;padding:2px 8px">Vac. — Vacances</span>
    <span style="font-size:12px;background:#FBF5E0;color:#7A5A10;border-radius:6px;padding:2px 8px">◀ Semaine en cours</span>
    <span style="font-size:12px;color:#B8670A">🎉 Jour(s) férié(s)</span>
  </div>`;

  return`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
    <h2 style="color:#3A4425;font-size:22px;font-weight:800">🎓 Planning des classes</h2>
  </div>${selH}${tH}${legendH}`;
}

    b.onclick=()=>{A.s.planAnneeSco=b.dataset.planAnnee;A.r();};
  });

// Vue classification des formateurs par filière
function rFILIERES(){
  const {eq}=A.s;
  const pedago=eq.filter(m=>m.sv==="Pédagogie"&&!m.archive);
  const nonClasses=pedago.filter(m=>!m.filiere);
  const classes=pedago.filter(m=>m.filiere);

  // Résumé par filière
  let resumeH=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px">`;
  Object.entries(FILIERES).forEach(([fil,fmeta])=>{
    const mbs=pedago.filter(m=>m.filiere===fil);
    resumeH+=`<div style="background:${fmeta.bg};border:2px solid ${fmeta.color};border-radius:12px;padding:13px;cursor:pointer" data-fil-filter="${fil}">
      <div style="font-size:16px;font-weight:800;color:${fmeta.color}">${fil}</div>
      <div style="font-size:24px;font-weight:800;color:${fmeta.color};margin:4px 0">${mbs.length}</div>
      <div style="font-size:12px;color:#555">formateur${mbs.length>1?"s":""}${mbs.length>0?` · ${mbs.map(m=>`${m.pr} ${m.nom}`).join(", ").substring(0,40)}${mbs.map(m=>m.pr).join("").length>20?"…":""}`:""}</div>
    </div>`;
  });
  // Non classés
  resumeH+=`<div style="background:${nonClasses.length>0?"#FDECEA":"#F5F5F5"};border:2px solid ${nonClasses.length>0?"#C0392B":"#DDD"};border-radius:12px;padding:13px">
    <div style="font-size:16px;font-weight:800;color:${nonClasses.length>0?"#C0392B":"#888"}">Non classés</div>
    <div style="font-size:24px;font-weight:800;color:${nonClasses.length>0?"#C0392B":"#888"};margin:4px 0">${nonClasses.length}</div>
    <div style="font-size:12px;color:#555">${nonClasses.length>0?"⚠ À classer":""}</div>
  </div></div>`;

  // Alerte si non classés
  let alertH="";
  if(nonClasses.length>0){
    alertH=`<div class="wbox" style="margin-bottom:14px">⚠ ${nonClasses.length} formateur${nonClasses.length>1?"s":" "}non classé${nonClasses.length>1?"s":""} — cliquez sur 🎯 Lancer le classement pour les affecter à une filière.</div>`;
  }

  // Tableau des formateurs avec leur filière
  let tabH=`<div class="card"><h3 style="font-size:16px;color:#3A4425;margin-bottom:12px">Formateurs pédagogiques (${pedago.length})</h3>`;
  if(!pedago.length){
    tabH+=`<p style="color:#888">Aucun formateur en service Pédagogie.</p>`;
  } else {
    tabH+=`<div style="display:flex;flex-direction:column;gap:6px">`;
    pedago.forEach(m=>{
      const fmeta=m.filiere?FILIERES[m.filiere]:null;
      tabH+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:#FAF7F0;border:1px solid #DDD5B8;border-radius:9px;flex-wrap:wrap;gap:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-weight:700;font-size:15px;color:#3A4425">${m.pr} ${m.nom}</span>
          <span style="font-size:12px;color:#888">${m.po||""}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          ${m.filiere
            ?`<span style="background:${fmeta.bg};color:${fmeta.color};border:1.5px solid ${fmeta.color};border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700">${m.filiere}</span>`

const TAUX_KM = 0.48; // €/km

// Types de frais divers
const TYPES_FRAIS = ["Repas","Hébergement","Péage","Parking","Fournitures","Autre"];

// ── Calcul distance via ViaMichelin (OSRM fallback) ──────────────
async function calcDistance(depart, arrivee){
  // On utilise l'API Nominatim (OpenStreetMap) pour géocoder
  // puis OSRM pour la distance routière — gratuit, sans clé API
  try {
    const geo = async (addr) => {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(addr+", France")}&format=json&limit=1`, {headers:{"User-Agent":"MFR-Neracais-RH/1.0"}});
      const d = await r.json();
      if(!d||!d[0]) throw new Error("Adresse non trouvée");
      return {lat:parseFloat(d[0].lat), lon:parseFloat(d[0].lon), label:d[0].display_name};
    };
    const [dep, arr] = await Promise.all([geo(depart), geo(arrivee)]);
    // OSRM routing
    const url = `https://router.project-osrm.org/route/v1/driving/${dep.lon},${dep.lat};${arr.lon},${arr.lat}?overview=false`;
    const r2 = await fetch(url);
    const d2 = await r2.json();
    if(d2.code!=="Ok") throw new Error("Itinéraire impossible");
    const km = Math.round(d2.routes[0].distance/1000);
    return {km, depLabel:dep.label, arrLabel:arr.label, ok:true};
  } catch(e) {
    return {km:0, error:e.message, ok:false};
  }
}

function calcTotalFiche(f){

  return km+frais;
}

  let lignesFrais=[...(d.lignesFrais||[])];
  let pj=[...(d.pj||[])];

  const calcTotal=()=>{
    const km=lignesKm.reduce((s,l)=>s+(l.km||0)*(l.ar?2:1)*TAUX_KM,0);
    const frais=lignesFrais.reduce((s,l)=>s+(parseFloat(l.montant)||0),0);
    const el=document.getElementById("fr-total-val");
    if(el) el.textContent=`${(km+frais).toFixed(2)} €`;
  };

  const syncKm=(i)=>{
    const dep=document.getElementById(`km-dep-${i}`)?.value||"";
    const arr=document.getElementById(`km-arr-${i}`)?.value||"";
    const ar=document.getElementById(`km-ar-${i}`)?.checked||false;
    if(lignesKm[i]){lignesKm[i].depart=dep;lignesKm[i].arrivee=arr;lignesKm[i].ar=ar;}
  };
  const syncFrais=(i)=>{
    const ty=document.getElementById(`fr-ty-${i}`)?.value||"Autre";
    const ds=document.getElementById(`fr-ds-${i}`)?.value||"";
    const mt=document.getElementById(`fr-mt-${i}`)?.value||"0";
    if(lignesFrais[i]){lignesFrais[i].type=ty;lignesFrais[i].desc=ds;lignesFrais[i].montant=mt;}
    calcTotal();
  };

  // Calculer km
  const calcKm=async(i)=>{
    syncKm(i);
    const l=lignesKm[i];
    if(!l.depart||!l.arrivee){alert("Renseignez départ et destination.");return;}
    const res=document.getElementById(`km-res-${i}`);
    if(res) res.textContent="⏳ Calcul en cours…";
    const result=await calcDistance(l.depart,l.arrivee);
    if(result.ok){
      lignesKm[i].km=result.km;
      const ar=document.getElementById(`km-ar-${i}`)?.checked||false;
      lignesKm[i].ar=ar;
      if(res) res.textContent=`${result.km} km${ar?" (×2) ":""} → ${(result.km*(ar?2:1)*TAUX_KM).toFixed(2)} €`;
      calcTotal();
    } else {
      if(res) res.textContent=`⚠ Erreur: ${result.error}`;
      alert(`Impossible de calculer la distance.\nErreur: ${result.error}\n\nVérifiez les adresses et réessayez.`);
    }
  };

  document.querySelectorAll("[data-calc-km]").forEach(b=>{b.onclick=()=>calcKm(parseInt(b.dataset.calcKm));});
  document.querySelectorAll("[data-rm-km]").forEach(b=>{b.onclick=()=>{lignesKm.splice(parseInt(b.dataset.rmKm),1);A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});};});
  document.querySelectorAll("[data-rm-fr]").forEach(b=>{b.onclick=()=>{lignesFrais.splice(parseInt(b.dataset.rmFr),1);A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});};});
  document.querySelectorAll("[data-rm-pj]").forEach(b=>{b.onclick=()=>{pj.splice(parseInt(b.dataset.rmPj),1);A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});};});

  document.querySelectorAll("[data-preview]").forEach(b=>{b.onclick=()=>{const p=pj[parseInt(b.dataset.preview)];if(p){const w=window.open();w.document.write(`<img src="${p.data}" style="max-width:100%">`);w.document.close();}};});

  // AR checkbox
  document.querySelectorAll("[id^='km-ar-']").forEach(cb=>{cb.onchange=()=>{const i=parseInt(cb.id.split("-")[2]);syncKm(i);calcTotal();};});

  // Ajouter trajet
  const bak=document.getElementById("fr-add-km");
  if(bak) bak.onclick=()=>{lignesKm.push({depart:"MFR Barbaste",arrivee:"",km:0,ar:false});A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});};

  // Ajouter frais
  const baf=document.getElementById("fr-add-frais");
  if(baf) baf.onclick=()=>{lignesFrais.push({type:"Repas",desc:"",montant:""});A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});};

  // Upload justificatifs
  const inp=document.getElementById("fr-pj-input");
  if(inp) inp.onchange=async(e)=>{
    const files=Array.from(e.target.files);
    for(const f of files){
      if(f.size>5*1024*1024){alert(`${f.name} est trop volumineux (max 5 Mo).`);continue;}
      const data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);});
      pj.push({name:f.name,type:f.type,size:f.size,data});
    }
    A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});
  };

  // Frais inputs sync
  for(let i=0;i<lignesFrais.length;i++){
    ["ty","ds","mt"].forEach(p=>{const el=document.getElementById(`fr-${p}-${i}`);if(el)el.oninput=()=>syncFrais(i);});
  }

  calcTotal();

  document.getElementById("fr-cancel").onclick=()=>A.set({modal:null});
  document.getElementById("fr-submit").onclick=()=>{
    const ob=document.getElementById("fr-ob").value;
    const dt=document.getElementById("fr-dt").value;
    const co=document.getElementById("fr-co").value;
    if(!ob||!dt){alert("Renseignez l'objet et la date.");return;}
    // Sync final
    for(let i=0;i<lignesKm.length;i++) syncKm(i);
    for(let i=0;i<lignesFrais.length;i++) syncFrais(i);
    const mb=A.s.eq.find(m=>m.id===A.s.user?.id);
    const km=lignesKm.reduce((s,l)=>s+(l.km||0)*(l.ar?2:1)*TAUX_KM,0);
    const frais=lignesFrais.reduce((s,l)=>s+(parseFloat(l.montant)||0),0);
    const total=km+frais;
    const fiche={id:uid(),cr:today2(),st:ST.ATT,mid:mb.id,nm:`${mb.pr} ${mb.nom}`,sv:mb.sv,em:mb.em,
      objet:ob,date:dt,lignesKm,lignesFrais,pj,commentaire:co,total,tauxKm:TAUX_KM};
    A.save("fr",[...(A.s.fr||[]),fiche]);
    A.set({modal:null});
    A.toast("Fiche soumise ✓ — en attente de validation direction");
  };
}

  const w=window.open("","_blank","width=900,height=700");
  w.document.write(html);w.document.close();
  setTimeout(()=>w.print(),700);

// ── Fiche salarié individuelle ────────────────────────────────────
function imprimerSalarie(mb, dd, df){
  const {abs,dem,heu,ord}=A.s;
  const cp=Math.max(0,(mb.cp||0)-(mb.cpp||0));
  const rc=Math.max(0,(mb.ra||0)-(mb.rp||0));
  const tt=Math.max(0,(mb.ttp||0)-(mb.ttu||0));

  // Filtrer par période
  const absMb=abs.filter(a=>a.mid===mb.id&&a.ty!=="Annulée"&&a.dd>=dd&&a.dd<=df);
  const demMb=dem.filter(d=>d.mid===mb.id&&d.dd>=dd&&d.dd<=df);
  const heuMb=heu.filter(h=>h.mid===mb.id&&h.dt>=dd&&h.dt<=df);
  const ordMb=ord.filter(o=>o.mid===mb.id&&o.dd>=dd&&o.dd<=df);

  const totalDep=heuMb.reduce((s,h)=>s+(h.dep||0),0);
  const totalRec=heuMb.filter(h=>h.st===ST.APP).reduce((s,h)=>s+(h.rc||0),0);

  let html=`<!`+`DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Fiche ${mb.pr} ${mb.nom}</title>${cssImpression()}</head><body>`;
  html+=entete(`Fiche individuelle — ${mb.pr} ${mb.nom}`,`${fD(dd)} au ${fD(df)}`,`${mb.po||""} · ${mb.sv||""} · Entrée le ${mb.de||"—"}`);

  // Soldes
  html+=`<div class="section"><h2>Soldes à ce jour</h2>
    <div class="kpi-grid">
      <div class="kpi"><div class="val">${cp}j</div><div class="lbl">Congés payés restants</div></div>
      <div class="kpi"><div class="val">${fH(rc*7)}</div><div class="lbl">Récupération disponible</div></div>
      <div class="kpi"><div class="val">${fH(tt)}</div><div class="lbl">Télétravail restant</div></div>
      <div class="kpi"><div class="val">${fH(totalRec)}</div><div class="lbl">Récup générée (période)</div></div>
    </div>
  </div>`;

  // Absences
  html+=`<div class="section"><h2>Absences (${absMb.length})</h2>`;
  if(!absMb.length)html+=`<p style="color:#888;font-size:12px">Aucune absence sur la période.</p>`;
  else{
    html+=`<table><thead><tr><th>Type</th><th>Début</th><th>Fin</th><th>Durée</th><th>Commentaire</th></tr></thead><tbody>`;
    absMb.forEach(a=>{const c=TC[a.ty]||TC["Autre"];html+=`<tr><td><span class="badge" style="background:${c.bg};color:${c.c};border-color:${c.b}">${c.e} ${a.ty}</span></td><td>${fD(a.dd)}</td><td>${fD(a.df||a.dd)}</td><td>${a.nj>0?a.nj+"j":"—"}</td><td>${a.co||"—"}</td></tr>`;});
    html+=`</tbody></table>`;
  }
  html+=`</div>`;

  // Demandes
  html+=`<div class="section"><h2>Demandes de congés (${demMb.length})</h2>`;
  if(!demMb.length)html+=`<p style="color:#888;font-size:12px">Aucune demande sur la période.</p>`;
  else{
    html+=`<table><thead><tr><th>Type</th><th>Début</th><th>Fin</th><th>Durée</th><th>Statut</th><th>Réponse</th></tr></thead><tbody>`;
    demMb.forEach(d=>{const c=TC[d.ty]||TC["Autre"];const sc={[ST.ATT]:"#B8670A",[ST.APP]:"#2E7D52",[ST.REF]:"#C0392B",[ST.ANN]:"#888"}[d.st]||"#888";html+=`<tr><td><span class="badge" style="background:${c.bg};color:${c.c};border-color:${c.b}">${c.e} ${d.ty}</span></td><td>${fD(d.dd)}</td><td>${fD(d.df||d.dd)}</td><td>${d.nj>0?d.nj+"j":"—"}</td><td><span style="color:${sc};font-weight:700">${d.st}</span></td><td>${d.rp||"—"}</td></tr>`;});
    html+=`</tbody></table>`;
  }
  html+=`</div>`;

  // Heures supplémentaires
  if(heuMb.length>0){
    // Extraire services spéciaux
    const avecSvc=heuMb.filter(h=>h.svcMidi||h.svcSoir||h.veillee);
    if(avecSvc.length>0){
      html+=`<div class="section"><h2>Services spéciaux déclarés</h2>
        <table><thead><tr><th>Date</th><th>Jour</th><th>Service midi</th><th>Service soir</th><th>Veillée</th></tr></thead><tbody>`;
      avecSvc.forEach(h=>{
        html+=`<tr><td>${fD(h.dt)}</td><td>${["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"][new Date(h.dt+"T12:00:00").getDay()]}</td>
          <td style="text-align:center">${h.svcMidi?"🍽️ 12h00–13h30":""}</td>
          <td style="text-align:center">${h.svcSoir?"🌆 17h30–19h00":""}</td>
          <td style="text-align:center">${h.veillee?"🌙 13h30–21h00":""}</td></tr>`;
      });
      html+=`</tbody></table>
        <p style="font-size:12px;color:#555;margin-top:4px">Services spéciaux comptabilisés dans l'annualisation.</p>
      </div>`;
    }
    html+=`<div class="section"><h2>Déclarations horaires — Dépassements</h2>`;
    const depOnly=heuMb.filter(h=>h.dep>0);
    if(!depOnly.length)html+=`<p style="color:#888;font-size:12px">Aucun dépassement sur la période.</p>`;
    else{
      html+=`<table><thead><tr><th>Date</th><th>Horaire</th><th>Théorique</th><th>Réel</th><th>Dépassement</th><th>Récup</th><th>Statut</th><th>Motif</th></tr></thead><tbody>`;
      depOnly.forEach(h=>{const sc={[ST.ATT]:"#B8670A",[ST.APP]:"#2E7D52",[ST.REF]:"#C0392B"}[h.st]||"#888";html+=`<tr><td>${fD(h.dt)}</td><td>${h.hd} → ${h.hf}</td><td>${fH(h.ht)}</td><td>${fH(h.hr)}</td><td style="color:#B8670A;font-weight:700">+${fH(h.dep)}</td><td style="color:#2E7D52;font-weight:700">${fH(h.rc||0)}${h.isDim?" ×1,5":""}</td><td style="color:${sc};font-weight:700">${h.st}</td><td>${h.mo||"—"}</td></tr>`;});
      html+=`</tbody></table>`;
      html+=`<p style="font-size:12px;color:#555;margin-top:4px">Total dépassements : <strong>${fH(totalDep)}</strong> · Récupérations générées (validées) : <strong>${fH(totalRec)}</strong></p>`;
    }
    html+=`</div>`;
  }

  // Ordres de mission
  if(ordMb.length>0){
    html+=`<div class="section"><h2>Ordres de mission (${ordMb.length})</h2>
      <table><thead><tr><th>Date</th><th>Objet</th><th>Départ</th><th>Véhicule</th><th>Statut</th></tr></thead><tbody>`;
    ordMb.forEach(o=>{const sc={[ST.ATT]:"#B8670A",[ST.APP]:"#2E7D52",[ST.REF]:"#C0392B"}[o.st]||"#888";html+=`<tr><td>${fD(o.dd)}</td><td>${o.ob}</td><td>${o.hd} — ${o.ld}</td><td>${o.ve==="oui"?"Oui":"Non"}</td><td style="color:${sc};font-weight:700">${o.st}</td></tr>`;});
    html+=`</tbody></table></div>`;
  }

  html+=`<div class="footer"><span>MFR du Néracais · ${mb.pr} ${mb.nom} · ${mb.sv||""}</span><span>Édité le ${fD(today2())}</span></div>
  <div class="sig-block"><div class="sig">Direction<br><br>P. DAUGE, Directrice</div><div class="sig">Salarié(e)<br><br>${mb.pr} ${mb.nom}</div></div>
  </body></html>`;

  const w=window.open("","_blank","width=900,height=700");
  w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);
}

// ── Récap demandes ────────────────────────────────────────────────
function imprimerDemandes(sv,st,dd,df){
  const {dem,eq}=A.s;
  let vis=dem.filter(d=>d.dd>=dd&&d.dd<=df);
  if(sv)vis=vis.filter(d=>d.sv===sv);
  if(st)vis=vis.filter(d=>d.st===st);
  vis.sort((a,b)=>a.dd.localeCompare(b.dd));

  let html=`<!`+`DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Récap demandes</title>${cssImpression()}</head><body>`;
  html+=entete("Récapitulatif des demandes",`${fD(dd)} au ${fD(df)}`,`${sv||"Tous services"} · ${st||"Tous statuts"} · ${vis.length} demande${vis.length>1?"s":""}`);

  // Stats rapides
  const byType={};vis.forEach(d=>{byType[d.ty]=(byType[d.ty]||0)+1;});
  const byStatut={};vis.forEach(d=>{byStatut[d.st]=(byStatut[d.st]||0)+1;});
  html+=`<div class="section"><h2>Synthèse</h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px">
      ${Object.entries(byType).map(([t,n])=>{const c=TC[t]||TC["Autre"];return`<span class="badge" style="background:${c.bg};color:${c.c};border-color:${c.b};font-size:12px;padding:4px 10px">${c.e} ${t} : ${n}</span>`;}).join("")}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${Object.entries(byStatut).map(([s,n])=>{const sc={[ST.ATT]:"#B8670A",[ST.APP]:"#2E7D52",[ST.REF]:"#C0392B",[ST.ANN]:"#888"}[s]||"#888";return`<span style="color:${sc};font-weight:700;font-size:13px">${s} : ${n}</span>`;}).join(" · ")}
    </div>
  </div>`;

  html+=`<div class="section"><h2>Détail des demandes</h2>
    <table><thead><tr><th>Salarié</th><th>Service</th><th>Type</th><th>Début</th><th>Fin</th><th>Durée</th><th>Statut</th><th>Commentaire</th></tr></thead><tbody>`;
  vis.forEach(d=>{
    const c=TC[d.ty]||TC["Autre"];

      <td>${fD(d.dd)}</td><td>${fD(d.df||d.dd)}</td>
      <td>${d.nj>0?d.nj+"j":"—"}</td>
      <td style="color:${sc};font-weight:700">${d.st}</td>
      <td>${d.co||d.rp||"—"}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  html+=`<div class="footer"><span>MFR du Néracais — Demandes</span><span>Édité le ${fD(today2())}</span></div></body></html>`;

  const w=window.open("","_blank","width=1000,height=700");
  w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);
}

function imprimerAbsences(as,sv){

  Object.entries(byType).forEach(([t,j])=>{const c=TC[t]||TC["Autre"];html+=`<tr><td><span class="badge" style="background:${c.bg};color:${c.c};border-color:${c.b}">${c.e} ${t}</span></td><td style="text-align:center">${vis.filter(a=>a.ty===t).length}</td><td style="text-align:center;font-weight:700">${j||"—"}</td></tr>`;});
  html+=`</tbody></table></div>`;

  html+=`<div class="section"><h2>Détail chronologique</h2>
    <table><thead><tr><th>Salarié</th><th>Service</th><th>Type</th><th>Début</th><th>Fin</th><th>Durée</th><th>Note</th></tr></thead><tbody>`;
  vis.forEach(a=>{
    const c=TC[a.ty]||TC["Autre"];
    html+=`<tr><td><strong>${a.nm}</strong></td><td>${a.sv||"—"}</td>
      <td><span class="badge" style="background:${c.bg};color:${c.c};border-color:${c.b}">${c.e} ${a.ty}</span></td>
      <td>${fD(a.dd)}</td><td>${fD(a.df||a.dd)}</td>
      <td>${a.nj>0?a.nj+"j":"en cours"}</td>
      <td>${a.co||"—"}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  html+=`<div class="footer"><span>MFR du Néracais — Absences ${as.replace("-","/")}</span><span>Édité le ${fD(today2())}</span></div></body></html>`;

  const w=window.open("","_blank","width=1000,height=700");
  w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);
}


// ══ ÉQUIPE ══════════════════════════════════════════════════════
function rEQ(){
  const {eq,abs}=A.s;let lH="";
  const eqVis=(A.s.eqFiltreArch?eq.filter(m=>m.archive):eq.filter(m=>!m.archive));
  eqVis.forEach(m=>{const cp=Math.max(0,(m.cp||0)-(m.cpp||0)),rc=Math.max(0,(m.ra||0)-(m.rp||0)),tt=Math.max(0,(m.ttp||0)-(m.ttu||0));const ec=abs.find(a=>{const t=today2();return a.mid===m.id&&a.dd<=t&&(a.df||a.dd)>=t&&a.ty!=="Annulée";});lH+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px"><div><div style="font-weight:800;font-size:17px;color:#3A4425">${m.pr} ${m.nom}</div><div style="font-size:15px;color:#555">${m.po||"—"}</div>
          <div style="font-size:15px;color:#888;margin-top:1px">🔑 ${m.pw?"••••••••":"<span style='color:#C0392B'>Aucun mot de passe</span>"}</div><span class="tsv" style="margin-top:3px;display:inline-block">${m.sv}</span>${m.em?`<div style="font-size:15px;color:#888;margin-top:2px">📧 ${m.em}</div>`:""}</div><div style="display:flex;gap:5px"><button class="btn bl bsm" data-edm="${m.id}">✏️</button><button class="btn bi bsm" data-rpwm="${m.id}" title="Réinitialiser mot de passe">🔑</button>${m.archive?`<button class="btn bs bsm" data-unarch="${m.id}">↩ Réactiver</button>`:`<button class="btn bw bsm" data-arch="${m.id}">📦 Archiver</button>`}<button class="btn bd bsm" data-dlm="${m.id}">🗑</button></div></div>${ec?`<div style="padding:5px 9px;background:#FAF7F0;border:1px solid #DDD5B8;border-radius:8px;margin-bottom:9px">${tBdg(ec.ty,true)}</div>`:""}<div class="g3"><div style="background:#FBF5E0;border-radius:7px;padding:6px;text-align:center"><div style="font-size:17px;font-weight:800;color:#C8A84B">${cp}j</div><div style="font-size:14px;color:#888">CP</div></div><div style="background:#EEF2E6;border-radius:7px;padding:6px;text-align:center"><div style="font-size:17px;font-weight:800;color:#5C6B3A">${rc}j</div><div style="font-size:14px;color:#888">Récup</div></div><div style="background:#E3F1FA;border-radius:7px;padding:6px;text-align:center"><div style="font-size:17px;font-weight:800;color:#1A6B9A">${hStr(tt)}</div><div style="font-size:14px;color:#888">TT</div></div></div></div>`;});
  const actifs=eq.filter(m=>!m.archive);const archivés=eq.filter(m=>m.archive);
  return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="color:#3A4425;font-size:22px;font-weight:800">Équipe (${actifs.length} actifs${archivés.length>0?" · "+archivés.length+" archivé"+(archivés.length>1?"s":""):""})</h2><button class="btn bp" id="bnam">+ Ajouter</button></div>
  <div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn ${A.s.eqFiltreArch?"bl":"bp"} bsm" data-eq-filtre="actifs">Actifs (${actifs.length})</button><button class="btn ${A.s.eqFiltreArch?"bp":"bl"} bsm" data-eq-filtre="archives">Archivés (${archivés.length})</button></div>
  ${lH}`;
}
function bEQ(){
  document.getElementById("bnam").onclick=()=>A.set({modal:{ty:"sm",data:{}}});
  document.querySelectorAll("[data-edm]").forEach(b=>{const m=A.s.eq.find(x=>x.id===b.dataset.edm);if(m)b.onclick=()=>A.set({modal:{ty:"sm",data:{init:m}}});});
  document.querySelectorAll("[data-dlm]").forEach(b=>{b.onclick=()=>{if(!confirm("Supprimer définitivement ce membre ?"))return;const l=A.s.eq.filter(m=>m.id!==b.dataset.dlm);A.save("eq",l);A.toast("Supprimé","error");};});
  document.querySelectorAll("[data-arch]").forEach(b=>{b.onclick=()=>{const l=A.s.eq.map(m=>m.id===b.dataset.arch?{...m,archive:true,dateArchive:today2()}:m);A.save("eq",l);A.toast("Membre archivé","warn");};});
  document.querySelectorAll("[data-unarch]").forEach(b=>{b.onclick=()=>{const l=A.s.eq.map(m=>m.id===b.dataset.unarch?{...m,archive:false,dateArchive:null}:m);A.save("eq",l);A.toast("Membre réactivé ✓","success");};});
  document.querySelectorAll("[data-eq-filtre]").forEach(b=>{b.onclick=()=>{A.set({eqFiltreArch:b.dataset.eqFiltre==="archives"});};});
  document.querySelectorAll("[data-rpwm]").forEach(b=>{
    b.onclick=()=>{
      const mid=b.dataset.rpwm;
      const m=A.s.eq.find(x=>x.id===mid);
      if(!m)return;
      const np=prompt(`Nouveau mot de passe pour ${m.pr} ${m.nom} :\n(Laisser vide pour annuler)`);
      if(np===null||np.trim()==="")return;
      if(np.trim().length<4){alert("Le mot de passe doit faire au moins 4 caractères.");return;}
      hashPwd(np.trim()).then(hpwd=>{
        const l=A.s.eq.map(x=>x.id===mid?{...x,pwhash:hpwd,pw:undefined}:x);
        A.save("eq",l);A.toast(`Mot de passe de ${m.pr} réinitialisé ✓`,"success");
      });
    };
  });
}
function rMdlSM(){const i=A.s.modal.data?.init||{};return mdl(i.id?"Modifier":"Ajouter un membre",`<div class="g2">${fld("Prénom *",`<input id="mbpr" value="${i.pr||""}">`)} ${fld("Nom *",`<input id="mbno" value="${i.nom||""}">`)}</div>${fld("Service *",sel("mbsv",SVC,i.sv||"","-- Choisir --"))}${fld("Poste",`<input id="mbpo" value="${i.po||""}" placeholder="ex: Formateur…">`)}${fld("Email",`<input type="email" id="mbem" value="${i.em||""}">`)}${fld("Date d'entrée",`<input id="mbde" value="${i.de||""}" placeholder="ex: 01/09/2025">`)}
    ${fld("Mot de passe",`<input type="password" id="mbpw" placeholder="${i.id?"Laisser vide pour ne pas changer":"Définir un mot de passe"}">`,i.id?"Laisser vide = mot de passe inchangé":"")}<div class="dvd"></div><div class="g2">${fld("Solde CP (j)",`<input type="number" id="mbcp" value="${i.cp??0}" min="0" step="0.5">`)} ${fld("Plafond TT (h/mois)",`<input type="number" id="mbtt" value="${i.ttp??8}" min="0" step="0.5">`)}</div><div class="dvd"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn bl" id="smcn">Annuler</button><button class="btn bp" id="smsb">${i.id?"Mettre à jour":"Ajouter"}</button></div>`);}
function bMdlSM(){
  document.getElementById("smcn").onclick=()=>A.set({modal:null});
  document.getElementById("smsb").onclick=()=>{
    const i=A.s.modal.data?.init||{};
    const pr=document.getElementById("mbpr").value,nom=document.getElementById("mbno").value,sv=document.getElementById("mbsv").value;
    if(!pr||!nom||!sv)return;
    const newpw=document.getElementById("mbpw").value.trim();
    const saveEntry=(pwhash)=>{
      const e={id:i.id||uid(),nom,pr,
        po:document.getElementById("mbpo").value,sv,
        em:document.getElementById("mbem").value,
        de:document.getElementById("mbde").value,
        cp:parseFloat(document.getElementById("mbcp").value)||0,
        cpp:i.cpp||0,ra:i.ra||0,rp:i.rp||0,
        ttp:parseFloat(document.getElementById("mbtt").value)||0,
        ttu:i.ttu||0,
        pwhash:pwhash||(i.pwhash||"")
      };
      const l=i.id?A.s.eq.map(m=>m.id===i.id?e:m):[...A.s.eq,e];
      A.save("eq",l);A.set({modal:null});
      A.toast(i.id?"Membre mis à jour ✓":"Membre ajouté ✓");
    };
    if(newpw&&newpw.length>=4) hashPwd(newpw).then(hp=>saveEntry(hp));
    else saveEntry(null);
  };
}

function bPR(){
  const blo=document.getElementById("btn-logout");
  if(blo)blo.onclick=()=>{A.s.role=null;A.s.user=null;K.s("ses",null);A.r();};
  const bp=document.getElementById("btn-purge");
  if(bp)bp.onclick=()=>{
    const cutoff=new Date();cutoff.setFullYear(cutoff.getFullYear()-5);
    const cutoffStr=cutoff.toISOString().split("T")[0];
    const toDelete=A.s.eq.filter(m=>m.archive&&m.dateArchive&&m.dateArchive<cutoffStr);
    if(!toDelete.length){alert("Aucune donnée à purger (membres archivés depuis > 5 ans).");return;}
    if(!confirm(`Purger définitivement ${toDelete.length} membre(s) archivé(s) depuis plus de 5 ans ?
Cette action est irréversible.`))return;
    const ids=new Set(toDelete.map(m=>m.id));
    const newEq=A.s.eq.filter(m=>!ids.has(m.id));
    const newAbs=A.s.abs.filter(a=>!ids.has(a.mid));
    const newDem=A.s.dem.filter(d=>!ids.has(d.mid));
    const newHeu=A.s.heu.filter(h=>!ids.has(h.mid));
    const newOrd=A.s.ord.filter(o=>!ids.has(o.mid));
    A.save("eq",newEq);A.save("abs",newAbs);A.save("dem",newDem);A.save("heu",newHeu);A.save("ord",newOrd);
    A.toast(`${toDelete.length} membre(s) purgé(s) ✓`,"success");
  };
}
