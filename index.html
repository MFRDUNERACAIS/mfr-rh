<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3A4425">
<title>MFR Néracais — RH</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Palatino Linotype',Georgia,serif;background:#FAF7F0;color:#2A2A2A;min-height:100vh}
input,select,textarea,button{font-family:inherit;font-size:14px}
button{cursor:pointer}
.app{max-width:900px;margin:0 auto;padding:16px 14px 80px}
.hdr{background:#3A4425;color:#fff;padding:0 18px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-t{font-size:13px;font-weight:800}
.hdr-s{font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.8px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #DDD5B8;display:flex;box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:100;min-height:70px}
.nb{flex:1;border:none;background:none;padding:12px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nb.on{border-top:2.5px solid #5C6B3A}
.nb .ic{font-size:16px}
.nb .lb{font-size:9px;color:#888}
.nb.on .lb{color:#5C6B3A;font-weight:700}
.bdg{position:absolute;top:4px;right:calc(50% - 16px);background:#C0392B;color:#fff;border-radius:50%;width:15px;height:15px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:14px;border:1px solid #DDD5B8;padding:16px;margin-bottom:10px}
.ca{border-left:4px solid #5C6B3A}
.btn{border:none;border-radius:8px;padding:9px 18px;font-weight:600;cursor:pointer;font-family:inherit}
.bp{background:#5C6B3A;color:#fff}
.bg{background:transparent;color:#5C6B3A;border:1.5px solid #5C6B3A}
.bd{background:#C0392B;color:#fff}
.bs{background:#2E7D52;color:#fff}
.bl{background:#FAF7F0;color:#2A2A2A;border:1px solid #DDD5B8}
.bw{background:#B8670A;color:#fff}
.bi{background:#1A6B9A;color:#fff}
.bgo{background:#C8A84B;color:#3A4425}
.bsm{padding:5px 12px;font-size:12px}
.bfull{width:100%}
.blg{padding:12px 26px;font-size:15px}
button:disabled{opacity:.5;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:11px;font-weight:700;color:#3A4425;text-transform:uppercase;letter-spacing:.6px}
.fld input,.fld select,.fld textarea{border:1.5px solid #DDD5B8;border-radius:8px;padding:9px 12px;background:#fff;color:#2A2A2A;outline:none;width:100%}
.fld textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:#fff;border-radius:18px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.mh{padding:16px 22px 12px;background:#3A4425;border-radius:18px 18px 0 0;display:flex;justify-content:space-between;align-items:center}
.mh h3{margin:0;color:#fff;font-size:15px}
.mc{border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:28px;height:28px;font-size:18px;line-height:26px;text-align:center;cursor:pointer}
.mb{padding:20px 22px 24px}
.bt{display:inline-flex;align-items:center;gap:3px;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;border:1.5px solid;white-space:nowrap}
.bs2{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;border:1.5px solid}
.dvd{height:1px;background:#EDE8D8;margin:12px 0}
.tst{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);color:#fff;padding:11px 26px;border-radius:40px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center;pointer-events:none}
.lgbg{min-height:100vh;background:linear-gradient(150deg,#3A4425 0%,#5C6B3A 55%,#7A8F4E 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.lgbox{background:#fff;border-radius:22px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 32px 80px rgba(0,0,0,.35)}
.lglogo{width:64px;height:64px;background:linear-gradient(135deg,#5C6B3A,#3A4425);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:30px}
.rtbl{overflow-x:auto;background:#fff;border-radius:14px;border:1px solid #DDD5B8}
.rtbl table{border-collapse:collapse;font-size:11px;min-width:100%}
.rtbl th{background:#3A4425;color:#fff;padding:8px 4px;text-align:center;font-size:10px;font-weight:600}
.stk1{text-align:left!important;padding-left:12px!important;min-width:160px;position:sticky;left:0;z-index:2;background:#3A4425}
.stk2{min-width:50px;position:sticky;left:160px;z-index:2;background:#3A4425}
.rtbl td{border-left:1px solid #EDE8D8;border-bottom:1px solid #EDE8D8;padding:2px;text-align:center;height:28px}
.td1{position:sticky;left:0;z-index:1;padding:6px 12px!important;text-align:left!important;border-right:1px solid #DDD5B8!important}
.td2{position:sticky;left:160px;z-index:1;text-align:center!important;border-right:1px solid #DDD5B8!important;padding:4px 6px!important;font-weight:700;font-size:11px!important}
.rtbl tr:nth-child(even) td{background:#FAF7F0}
.we{background:#F5F3EE!important}
.tod{background:#FBF5E0!important}
.cgrd{display:grid;grid-template-columns:repeat(7,1fr)}
.cc{min-height:65px;padding:3px;border-right:1px solid #EDE8D8;border-bottom:1px solid #EDE8D8}
.ce{background:#F8F6F0}
.cw{background:#F5F3EE}
.ct{background:#FBF5E0}
.cd{font-size:11px;color:#888;margin-bottom:2px;padding-left:2px}
.cev{border-radius:3px;padding:1px 3px;font-size:9.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:1px;border-left:2.5px solid transparent}
.flt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.flt select{border:1.5px solid #DDD5B8;border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;flex:1;min-width:140px}
.kgrd{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.kpi{border-radius:14px;padding:14px;cursor:pointer}
.pbar{height:8px;background:#EDE8D8;border-radius:4px;margin:5px 0 3px}
.pfill{height:100%;border-radius:4px}
.sc{background:#FAF7F0;border:1px solid #DDD5B8;border-radius:12px;padding:11px 13px;text-align:center}
.sc .val{font-size:20px;font-weight:800}
.sc .lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.wbox{background:#FEF3E2;border:1.5px solid #E8A030;border-radius:10px;padding:10px 14px;font-size:13px;color:#7A4A00;font-weight:600;margin-bottom:12px}
.ibox{background:#E3F1FA;border:1px solid rgba(26,107,154,.3);border-radius:8px;padding:8px 12px;font-size:12px;color:#1A6B9A;margin-bottom:10px}
.snav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.snav span{font-size:13px;font-weight:600;color:#3A4425;min-width:100px;text-align:center}
.odr{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.agrd{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ach{border-radius:10px;padding:10px 12px;text-align:center;border:1.5px solid}
.tsv{font-size:11px;background:#EEF2E6;color:#5C6B3A;border:1px solid rgba(92,107,58,.25);border-radius:10px;padding:1px 8px;display:inline-block}
@media(max-width:600px){.g2{grid-template-columns:1fr}.odr{grid-template-columns:1fr 1fr}}

/* Mobile optimisations */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
input,select,textarea{font-size:16px!important}/* évite zoom auto iOS */
.nav{padding-bottom:env(safe-area-inset-bottom,0)}
.app{padding-bottom:calc(90px + env(safe-area-inset-bottom,0))}
</style>
</head>

Object.entries(JOURS_FERIES).forEach(([ds,nom])=>{
  const d=new Date(ds+"T12:00:00"),dow=d.getDay();
  if(dow===4){
    const v=new Date(d);v.setDate(v.getDate()+1);
    PONTS_POSSIBLES[v.toISOString().split("T")[0]]={nom:`Pont après ${nom}`,type:"pont"};
  } else if(dow===2){
    const l=new Date(d);l.setDate(l.getDate()-1);
    PONTS_POSSIBLES[l.toISOString().split("T")[0]]={nom:`Pont avant ${nom}`,type:"pont"};
  }
});


const SEUILS = {OK:80, WARN:60}; 
function getSeuilColor(pct){
  if(pct>=SEUILS.OK) return{bg:"#E8F5EE",c:"#2E7D52",b:"#5AAA80",label:"✅ Conforme"};
  if(pct>=SEUILS.WARN) return{bg:"#FEF3E2",c:"#B8670A",b:"#E8A030",label:"⚠️ Vigilance"};
  return{bg:"#FDECEA",c:"#C0392B",b:"#E08080",label:"🚨 Alerte"};
}


function parseDDMMYYYY(s){
  if(!s)return null;
  const[d,m,y]=s.split("/");
  return`${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
}


function getPlanningForDate(dateStr, annee){
  const data=PLANNING_RAW[annee]||[];
  return data.find(row=>{
    const debut=parseDDMMYYYY(row[1]);
    const fin=parseDDMMYYYY(row[2]);
    return dateStr>=debut&&dateStr<=fin;
  })||null;
}


function getAnneeScolaireFromDate(dateStr){
  const y=parseInt(dateStr.split("-")[0]);
  const m=parseInt(dateStr.split("-")[1]);
  return m>=8?`${y}-${y+1}`:`${y-1}-${y}`;
}


function nbClassesPresentesSemaine(row){
  if(!row)return 0;
  const vals=row.slice(3,13);
  return vals.filter(v=>v&&v!=="Vac"&&v!=="Stage"&&v!=="Ent").length;
}


function tauxPresenceFiliere(equipe,absences,dateStr,filiere){
  const fili=FILIERES[filiere];if(!fili)return null;
  
  const membres=equipe.filter(m=>m.sv==="Pédagogie"&&m.filiere===filiere&&!m.archive);
  if(!membres.length)return{pct:100,present:0,absent:0,total:0};
  const absJour=absences.filter(a=>{
    if(!membres.find(m=>m.id===a.mid))return false;
    if(a.ty==="Annulée")return false;
    return a.dd<=dateStr&&(a.df||a.dd)>=dateStr;
  });
  const present=membres.length-absJour.length;
  const pct=Math.round((present/membres.length)*100);
  return{pct,present,absent:absJour.length,total:membres.length};
}

    Object.entries(FILIERES).forEach(([filiere,fmeta])=>{
      const mbrsFil=eq.filter(m=>m.sv==="Pédagogie"&&m.filiere===filiere&&!m.archive);
      if(!mbrsFil.length){
        absFilH+=`<div style="margin-bottom:8px;opacity:.5"><div style="font-size:13px;font-weight:700;color:${fmeta.color};margin-bottom:3px">${filiere} — <span style="font-size:12px;font-weight:400">Aucun formateur assigné</span></div></div>`;
        return;
      }
      
      const[y,mo]=ms.split("-").map(Number);
      const dernJ=new Date(y,mo,0);let jo=0;
      for(let d=new Date(y,mo-1,1);d<=dernJ;d.setDate(d.getDate()+1)){if(d.getDay()!==0&&d.getDay()!==6)jo++;}
      const cap=mbrsFil.length*jo;
      const dM=`${ms}-01`,fM=`${ms}-${String(dernJ.getDate()).padStart(2,"0")}`;
      let tot=0;
      abs.forEach(a=>{
        if(!mbrsFil.find(m=>m.id===a.mid)||a.ty==="Annulée")return;
        const db=a.dd>dM?a.dd:dM;const fi=(a.df||a.dd)<fM?(a.df||a.dd):fM;
        if(db<=fi)tot+=nJO(db,fi,a.cj||1);
      });
      const pct=cap>0?Math.round(((cap-tot)/cap)*100):100;
      const scfg=getSeuilColor(pct);
      absFilH+=`<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="width:10px;height:10px;border-radius:50%;background:${fmeta.color};display:inline-block"></span>
            <span style="font-size:14px;font-weight:700;color:#3A4425">${filiere}</span>
            <span style="font-size:12px;color:#888">(${mbrsFil.length} formateur${mbrsFil.length>1?"s":""})</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;background:${scfg.bg};color:${scfg.c};border:1px solid ${scfg.b};border-radius:8px;padding:2px 8px;font-weight:700">${scfg.label}</span>
            <span style="font-size:19px;font-weight:800;color:${scfg.c}">${pct}%</span>
          </div>
        </div>
        <div class="pbar"><div class="pfill" style="width:${pct}%;background:${scfg.c}"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:2px">
          <span>${mbrsFil.filter(m=>{const a=abs.find(ab=>ab.mid===m.id&&ab.ty!=="Annulée"&&ab.dd<=today2()&&(ab.df||ab.dd)>=today2());return!a;}).length} présents auj.</span>
          <span>Seuil Qualiopi : 80%</span>
        </div>
      </div>`;
    });
    
    const autresSvc=["Administratif","Vie résidentielle","Direction","AESH"];
    autresSvc.forEach(sv=>{
      const d=pres[sv];if(!d)return;
      const scfg=getSeuilColor(d.pct);
      absFilH+=`<div style="margin-bottom:6px;padding:6px 10px;background:#FAF7F0;border-radius:8px;border-left:3px solid #DDD5B8;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;color:#555">${sv} (${d.nb})</span>
        <div style="display:flex;align-items:center;gap:6px">
          <div style="width:80px;height:6px;background:#EDE8D8;border-radius:3px"><div style="width:${d.pct}%;height:100%;background:${scfg.c};border-radius:3px"></div></div>
          <span style="font-size:13px;font-weight:700;color:${scfg.c}">${d.pct}%</span>
        </div>
      </div>`;
    });
    absFilH+=`</div>`;

    
    let absAujH="";
    if(absAuj.length>0){
      absAujH=`<div class="card" style="margin-bottom:12px"><h3 style="font-size:16px;color:#3A4425;margin-bottom:10px">Absents aujourd'hui (${absAuj.length})</h3>
        <div style="display:flex;flex-wrap:wrap;gap:7px">`;
      absAuj.forEach(a=>{
        const mb2=eq.find(m=>m.id===a.mid);
        const fil=mb2?.filiere||mb2?.sv||"";
        absAujH+=`<div style="display:flex;align-items:center;gap:7px;background:#FAF7F0;border:1px solid #DDD5B8;border-radius:8px;padding:6px 12px">
          <span style="font-size:14px;font-weight:700">${a.nm}</span>
          ${fil?`<span style="font-size:11px;color:#888;background:#EEF2E6;border-radius:6px;padding:1px 7px">${fil}</span>`:""}
          ${tBdg(a.ty,true)}</div>`;
      });
      absAujH+=`</div></div>`;
    }

    
    let anticipH=`<div class="card"><h3 style="font-size:16px;color:#3A4425;margin-bottom:12px">📅 Prochaines semaines — Classes présentes</h3>`;
    for(let s=0;s<4;s++){
      const futLundi=new Date(semLundi+"T12:00:00");futLundi.setDate(futLundi.getDate()+s*7);
      const futStr=futLundi.toISOString().split("T")[0];
      if(s===0){anticipH+=``;continue;} 
      const futAS=getAnneeScolaireFromDate(futStr);
      const futRow=getPlanningForDate(futStr,futAS);
      const futN=futRow?nbClassesPresentesSemaine(futRow):0;
      const futFeries=[];
      for(let i=0;i<5;i++){const fd=new Date(futLundi);fd.setDate(fd.getDate()+i);const fds=fd.toISOString().split("T")[0];if(JOURS_FERIES[fds]||PONTS_POSSIBLES[fds])futFeries.push(JOURS_FERIES[fds]||PONTS_POSSIBLES[fds].nom);}
      const futVen=new Date(futLundi);futVen.setDate(futVen.getDate()+4);
      anticipH+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#FAF7F0;border-radius:8px;margin-bottom:5px;border-left:3px solid ${futN>5?"#2E7D52":futN>2?"#B8670A":"#CCC"}">
        <div><span style="font-size:14px;font-weight:700;color:#3A4425">Sem. ${futRow?futRow[0]:"—"}</span><span style="font-size:13px;color:#888;margin-left:8px">${fD(futStr)} → ${fD(futVen.toISOString().split("T")[0])}</span>${futFeries.length>0?`<span style="font-size:12px;color:#B8670A;margin-left:6px">🎉 ${futFeries.join(", ")}</span>`:""}</div>
        <span style="font-size:16px;font-weight:800;color:${futN>5?"#2E7D52":futN>2?"#B8670A":"#888"}">${futN}/${totalClasses} cl.</span>
      </div>`;
    }
    anticipH+=`</div>`;

    // ── ORDRE CHRONOLOGIQUE ─────────────────────────────────
    // 1. AUJOURD'HUI : absents + demandes en attente + locations en cours
    // 2. CETTE SEMAINE : nav semaine + fériés + classes présentes + minibus dispo
    // 3. À VENIR : absentéisme filières + prochaines semaines + alertes

    return`<h2 style="color:#3A4425;font-size:22px;font-weight:800;margin-bottom:4px">Bonjour, ${user?.pr||""} 👋</h2>
      <p style="color:#888;font-size:13px;margin-bottom:14px">Année scolaire ${getAS()} · 1er sept → 31 août</p>
      ${A.s._cpRechargeInfo?`<div style="background:#E8F5EE;border:1.5px solid #5AAA80;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px;color:#2E7D52;font-weight:700">🎉 CP rechargés automatiquement — ${A.s._cpRechargeInfo.nb} salarié${A.s._cpRechargeInfo.nb>1?"s":""} mis à jour le ${fD(A.s._cpRechargeInfo.date)}</div>`:""}

    ${user?.id==="mfr001"?rBlocAnniversaires(eq):""}
        ${/* ── 1. AUJOURD'HUI ── */""}
      <div style="background:#3A4425;border-radius:10px;padding:8px 14px;margin-bottom:10px">
        <span style="color:#C8A84B;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px">📍 Aujourd'hui — ${fD(today2())}</span>
      </div>
      ${kpiH}
      ${absAujH}
      ${rBandeauAlertes(eq)}
      ${rBlocLocations()}

      ${/* ── 2. CETTE SEMAINE ── */""}
      <div style="background:#5C6B3A;border-radius:10px;padding:8px 14px;margin-bottom:10px;margin-top:4px">
        <span style="color:#C8A84B;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px">📅 Cette semaine</span>
      </div>
      ${navH}${feriesH}
      ${planH}

      ${/* ── 3. À VENIR ── */""}
      <div style="background:#7A6030;border-radius:10px;padding:8px 14px;margin-bottom:10px;margin-top:4px">
        <span style="color:#FBF5E0;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px">🔭 À venir & suivi</span>
      </div>
      ${absFilH}
      ${anticipH}`;
  }

  
  const cp=Math.max(0,(mb?.cp||0)-(mb?.cpp||0));
  const rc=Math.max(0,(mb?.ra||0)-(mb?.rp||0));
  const tt=Math.max(0,(mb?.ttp||0)-(mb?.ttu||0));
  let mdH=`<div class="card"><h3 style="font-size:16px;color:#3A4425;margin-bottom:12px">Mes dernières demandes</h3>`;
  if(!mesD.length)mdH+=`<p style="color:#888;font-size:14px">Aucune demande — cliquez sur "+ Demande"</p>`;
  else mesD.forEach(d=>{mdH+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#FAF7F0;border:1px solid #DDD5B8;border-radius:10px;flex-wrap:wrap;gap:8px;margin-bottom:8px"><div>${tBdg(d.ty,true)}<span style="font-size:13px;color:#555;margin-left:8px">${fD(d.dd)}${d.nj>0?` · ${d.nj}j`:""}</span>${d.rp?`<div style="font-size:12px;color:${d.st===ST.APP?"#2E7D52":"#C0392B"};margin-top:2px">📩 ${d.rp}</div>`:""}</div>${sBdg(d.st)}</div>`;});
  mdH+=`</div>`;
  // Annonces récentes pour le salarié
  const annoncesRec=(A.s.affichage||[]).filter(x=>!x.archivé).sort((a,b)=>b.cr.localeCompare(a.cr)).slice(0,2);
  const affBandeau=annoncesRec.length>0?`<div style="cursor:pointer" data-nav="af">
    ${annoncesRec.map(m=>{const t=AFF_TYPES[m.type]||AFF_TYPES.Information;return`<div style="background:${t.bg};border:1.5px solid ${t.c};border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start">
      <span style="font-size:18px">${t.ic}</span>
      <div><div style="font-weight:700;color:#2A2A2A">${m.titre}</div><div style="font-size:12px;color:#888">${fD(m.cr)}</div></div>
    </div>`;}).join("")}
  </div>`:"";
  return`<h2 style="color:#3A4425;font-size:22px;font-weight:800;margin-bottom:4px">Bonjour, ${user?.pr||""} 👋</h2>
    <p style="color:#888;font-size:13px;margin-bottom:14px">Période : ${getAS()}</p>
    ${affBandeau}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin-bottom:14px">
      <div class="sc"><div class="lbl">CP restants</div><div class="val" style="color:#C8A84B">${cp}<span style="font-size:13px;color:#888">j</span></div></div>
      <div class="sc"><div class="lbl">Récupération</div><div class="val" style="color:#5C6B3A">${rc}<span style="font-size:13px;color:#888">j</span></div></div>
      <div class="sc"><div class="lbl">TT ce mois</div><div class="val" style="color:#1A6B9A">${hStr(tt)}</div></div>
    </div>${mdH}`;
}

function rPLANNING_CLASSES(){
  const anneeSco=A.s.planAnneeSco||getAS()||"2025-2026";
  const data=PLANNING_RAW[anneeSco]||[];
  if(!data.length) return`<p style="color:#888">Aucune donnée pour ${anneeSco}</p>`;

  
  let selH=`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    ${["2025-2026","2026-2027"].map(a=>`<button class="btn ${a===anneeSco?"bp":"bl"} bsm" data-plan-annee="${a}">${a}</button>`).join("")}
  </div>`;

  
  let tH=`<div style="overflow-x:auto;border-radius:12px;border:1px solid #DDD5B8;background:#fff">
    <table style="border-collapse:collapse;min-width:100%;font-size:13px">
      <thead>
        <tr style="background:#3A4425">
          <th style="padding:9px 12px;color:#fff;text-align:left;font-size:12px;position:sticky;left:0;background:#3A4425;z-index:2;min-width:120px">Semaine</th>
          <th style="padding:9px 8px;color:#fff;font-size:12px;min-width:100px">Dates</th>`;

  
  Object.entries(FILIERES).forEach(([fil,fmeta])=>{
    fmeta.classes.forEach(clsKey=>{
      tH+=`<th style="padding:9px 5px;font-size:11px;font-weight:700;color:#fff;text-align:center;min-width:70px;border-left:1px solid rgba(255,255,255,.2)" title="${CLASSES_META[clsKey].label}">${CLASSES_META[clsKey].label}</th>`;
    });
  });
  tH+=`<th style="padding:9px 8px;color:#fff;font-size:12px;text-align:center;border-left:1px solid rgba(255,255,255,.3)">Total</th></tr>
      <!-- Sous-en-tête filières -->
      <tr style="background:#5C6B3A">
        <td colspan="2" style="padding:4px 12px;font-size:11px;color:rgba(255,255,255,.6)">Filière →</td>`;
  Object.entries(FILIERES).forEach(([fil,fmeta])=>{
    tH+=`<td colspan="${fmeta.classes.length}" style="padding:4px 5px;text-align:center;font-size:11px;font-weight:700;color:#fff;background:${fmeta.color};border-left:2px solid rgba(255,255,255,.3)">${fil}</td>`;
  });
  tH+=`<td></td></tr></thead><tbody>`;

  
  data.forEach((row,ri)=>{
    const semNum=row[0],debut=row[1],fin=row[2];
    const debutISO=parseDDMMYYYY(debut);
    const isCurrentWeek=debutISO&&debutISO<=today2()&&parseDDMMYYYY(fin)>=today2();
    const isFuture=debutISO&&debutISO>today2();
    
    const hasFeries=debutISO&&Object.keys(JOURS_FERIES).some(f=>f>=debutISO&&f<=parseDDMMYYYY(fin));
    const bgRow=isCurrentWeek?"#FBF5E0":ri%2===0?"#fff":"#FAF7F0";

    tH+=`<tr style="background:${bgRow}${isCurrentWeek?";outline:2px solid #C8A84B;outline-offset:-1px":""}" title="${isCurrentWeek?"← Semaine en cours":""}">
      <td style="padding:7px 12px;font-weight:${isCurrentWeek?"800":"600"};color:${isCurrentWeek?"#7A5A10":"#3A4425"};position:sticky;left:0;background:${bgRow};border-right:1px solid #DDD5B8">
        S${semNum}${isCurrentWeek?" ◀":""}${hasFeries?` 🎉`:""}
      </td>
      <td style="padding:7px 8px;font-size:12px;color:#555;white-space:nowrap">${debut?.split("/")[0]}/${debut?.split("/")[1]} → ${fin?.split("/")[0]}/${fin?.split("/")[1]}</td>`;

    let nbPres=0;
    CLASSES_ORDER.forEach((clsKey,ci)=>{
      const rawVal=row[3+ci]||"";
      const st=normalise(rawVal);
      if(st==="P")nbPres++;
      const fmeta=FILIERES[CLASSES_META[clsKey].filiere];
      const cfg={
        P:{bg:fmeta.bg,c:fmeta.color,ico:"✅",txt:rawVal},
        S:{bg:"#F5F5F5",c:"#888",ico:"🏭",txt:rawVal==="Ent"?"Ent.":"Stage"},
        V:{bg:"#EEE",c:"#AAA",ico:"",txt:"Vac."}
      }[st];
      tH+=`<td style="padding:4px 3px;text-align:center;border-left:1px solid #EDE8D8">
        <span style="background:${cfg.bg};color:${cfg.c};border-radius:5px;padding:2px 4px;font-size:11px;font-weight:700;white-space:nowrap">${cfg.ico} ${cfg.txt}</span>
      </td>`;
    });

    const totalColor=nbPres>=7?"#2E7D52":nbPres>=4?"#B8670A":"#C0392B";
    tH+=`<td style="padding:7px 8px;text-align:center;font-weight:800;font-size:15px;color:${totalColor};border-left:2px solid #DDD5B8">${nbPres}</td></tr>`;
  });

  tH+=`</tbody></table></div>`;

  
  let legendH=`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
    <span style="font-size:13px;color:#555">Légende :</span>
    <span style="font-size:12px;background:#EEF2E6;color:#3A4425;border-radius:6px;padding:2px 8px">✅ Présente en MFR</span>
    <span style="font-size:12px;background:#F5F5F5;color:#888;border-radius:6px;padding:2px 8px">🏭 Stage / Entreprise</span>
    <span style="font-size:12px;background:#EEE;color:#AAA;border-radius:6px;padding:2px 8px">Vac. — Vacances</span>
    <span style="font-size:12px;background:#FBF5E0;color:#7A5A10;border-radius:6px;padding:2px 8px">◀ Semaine en cours</span>
    <span style="font-size:12px;color:#B8670A">🎉 Jour(s) férié(s)</span>
  </div>`;

  return`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
    <h2 style="color:#3A4425;font-size:22px;font-weight:800">🎓 Planning des classes</h2>
  </div>${selH}${tH}${legendH}`;
}

function rFILIERES(){
  const {eq}=A.s;
  const pedago=eq.filter(m=>m.sv==="Pédagogie"&&!m.archive);
  const nonClasses=pedago.filter(m=>!m.filiere);
  const classes=pedago.filter(m=>m.filiere);

  
  let resumeH=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px">`;
  Object.entries(FILIERES).forEach(([fil,fmeta])=>{
    const mbs=pedago.filter(m=>m.filiere===fil);
    resumeH+=`<div style="background:${fmeta.bg};border:2px solid ${fmeta.color};border-radius:12px;padding:13px;cursor:pointer" data-fil-filter="${fil}">
      <div style="font-size:16px;font-weight:800;color:${fmeta.color}">${fil}</div>

      <div style="font-size:12px;color:#555">formateur${mbs.length>1?"s":""}${mbs.length>0?` · ${mbs.map(m=>`${m.nom} ${m.pr}`).join(", ").substring(0,40)}${mbs.map(m=>m.pr).join("").length>20?"…":""}`:""}</div>
    </div>`;
  });
  
  resumeH+=`<div style="background:${nonClasses.length>0?"#FDECEA":"#F5F5F5"};border:2px solid ${nonClasses.length>0?"#C0392B":"#DDD"};border-radius:12px;padding:13px">
    <div style="font-size:16px;font-weight:800;color:${nonClasses.length>0?"#C0392B":"#888"}">Non classés</div>
    <div style="font-size:24px;font-weight:800;color:${nonClasses.length>0?"#C0392B":"#888"};margin:4px 0">${nonClasses.length}</div>
    <div style="font-size:12px;color:#555">${nonClasses.length>0?"⚠ À classer":""}</div>
  </div></div>`;

  
  let alertH="";
  if(nonClasses.length>0){
    alertH=`<div class="wbox" style="margin-bottom:14px">⚠ ${nonClasses.length} formateur${nonClasses.length>1?"s":" "}non classé${nonClasses.length>1?"s":""} — cliquez sur 🎯 Lancer le classement pour les affecter à une filière.</div>`;
  }

  
  let tabH=`<div class="card"><h3 style="font-size:16px;color:#3A4425;margin-bottom:12px">Formateurs pédagogiques (${pedago.length})</h3>`;
  if(!pedago.length){
    tabH+=`<p style="color:#888">Aucun formateur en service Pédagogie.</p>`;
  } else {
    tabH+=`<div style="display:flex;flex-direction:column;gap:6px">`;
    pedago.forEach(m=>{
      const fmeta=m.filiere?FILIERES[m.filiere]:null;
      tabH+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:#FAF7F0;border:1px solid #DDD5B8;border-radius:9px;flex-wrap:wrap;gap:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-weight:700;font-size:15px;color:#3A4425">${m.nom} ${m.pr}</span>
          <span style="font-size:12px;color:#888">${m.po||""}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          ${m.filiere
            ?`<span style="background:${fmeta.bg};color:${fmeta.color};border:1.5px solid ${fmeta.color};border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700">${m.filiere}</span>`
            :`<span style="background:#FDECEA;color:#C0392B;border:1.5px solid #E08080;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700">⚠ Non classé</span>`}

  BROUILLON:"Brouillon",SOUMISE:"Soumise",ATT_DIR:"En attente Direction",
  VALIDEE:"Validée Direction",REFUSEE:"Refusée",COMPTA:"Transmise Comptabilité",
  PAYEE:"Payée",ARCHIVEE:"Archivée"

async function calcDistance(depart, arrivee){
  // Géocodage via Nominatim (OpenStreetMap) + routage via OSRM
  const geocode = async (addr) => {
    const q = encodeURIComponent(addr.trim() + (addr.toLowerCase().includes('france')?'':', France'));
    const url = `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=fr`;
    const r = await fetch(url, {
      headers:{"Accept":"application/json","Accept-Language":"fr"}
    });
    if(!r.ok) throw new Error(`Erreur géocodage HTTP ${r.status}`);
    const data = await r.json();
    if(!data||!data.length) throw new Error(`Adresse introuvable : "${addr}". Essayez avec ville + code postal.`);
    return {lat:parseFloat(data[0].lat), lon:parseFloat(data[0].lon), label:data[0].display_name};
  };

  try {
    // Géocoder les 2 adresses en parallèle
    const [dep, arr] = await Promise.all([geocode(depart), geocode(arrivee)]);

    // Calcul itinéraire OSRM
    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${dep.lon},${dep.lat};${arr.lon},${arr.lat}?overview=false`;
    const r2 = await fetch(osrmUrl);
    if(!r2.ok) throw new Error(`Erreur routage OSRM HTTP ${r2.status}`);
    const d2 = await r2.json();
    if(!d2||d2.code!=="Ok"||!d2.routes||!d2.routes.length) throw new Error("Itinéraire impossible entre ces deux adresses");
    
    const km = Math.round(d2.routes[0].distance / 1000);
    return {km, depLabel:dep.label, arrLabel:arr.label, ok:true};

  } catch(e) {
    console.error("calcDistance error:", e.message);
    return {km:0, error:e.message, ok:false};
  }
}

// Initialisation budgets si absent
function initBudgets(){
  if(!A.s.budgets) A.s.budgets=[];
  if(!A.s.devis) A.s.devis=[];

// Calcul synthèse budget d'une entité (classe ou animation)
function calcBudget(entityId, annee){
  const budgets=(A.s.budgets||[]).filter(b=>b.entityId===entityId&&b.annee===annee);
  const devisListe=(A.s.devis||[]).filter(d=>d.entityId===entityId&&d.annee===annee&&d.st!==ST_BUD.ANN&&d.st!==ST_BUD.REF);
  
  const alloue=budgets.reduce((s,b)=>s+(b.montant||0),0);
  const engage=devisListe.filter(d=>d.st===ST_BUD.ATT||d.st===ST_BUD.OK).reduce((s,d)=>s+(d.montant||0),0);
  const paye=devisListe.filter(d=>d.st===ST_BUD.PAY).reduce((s,d)=>s+(d.montant||0),0);
  const restant=alloue-engage-paye;
  const pct=alloue>0?Math.round(((engage+paye)/alloue)*100):0;
  return{alloue,engage,paye,restant,pct,alerte:pct>=80};
}

// Calculer le niveau d'alerte d'une échéance
function getAlertLevel(dateEch){
  const today=new Date(); today.setHours(0,0,0,0);
  const ech=new Date(dateEch+"T00:00:00");
  const diff=Math.round((ech-today)/(1000*60*60*24));
  if(diff<0)  return{...ALERT_SEUILS[0], diff};
  if(diff<=7) return{...ALERT_SEUILS[1], diff};
  if(diff<=30)return{...ALERT_SEUILS[2], diff};
  if(diff<=90)return{...ALERT_SEUILS[3], diff};
  return{...ALERT_SEUILS[4], diff};
}

// Générer les échéances automatiques depuis les données RH
function genEcheancesAuto(eq){
  // Alerte recharge CP (J-30 avant le 1er septembre)
  const nowCP=new Date();const yyyyCP=nowCP.getFullYear();
  const dateRecharge=`${nowCP.getMonth()>=8?yyyyCP+1:yyyyCP}-09-01`;
  const auto_cp=[{
    id:`cp_recharge_alerte_${yyyyCP}`,auto:true,mid:null,nm:"Toute l'équipe",
    type:"Rappel",
    label:`Recharge automatique des CP — 1er septembre ${dateRecharge.split("-")[0]}`,
    date:dateRecharge,
    note:`Les soldes CP de tous les salariés seront rechargés automatiquement au 1er septembre. Vérifiez les capitaux annuels dans les fiches membres avant cette date.`,
  }];
  const auto=[];
  const today=new Date(); today.setHours(0,0,0,0);

  eq.filter(m=>!m.archive).forEach(m=>{
    const nm=`${m.nom} ${m.pr}`;

    // Visites médicales périodiques (5 ans depuis la dernière visite saisie)
    if(m.dernVisite){
      const proch=new Date(m.dernVisite+"T00:00:00");
      proch.setFullYear(proch.getFullYear()+5);
      auto.push({
        id:`vm_${m.id}`,auto:true,mid:m.id,nm,
        type:"Visite médicale",
        label:`Visite médicale périodique — ${nm}`,
        date:proch.toISOString().split("T")[0],
        note:`Dernière visite : ${fD(m.dernVisite)}. Périodicité : 5 ans (art. R.4624-16 CT).`,
      });
    }

    // Points enfants (21 ans de l'enfant)
    if(m.enfants&&m.enfants.length>0){
      m.enfants.forEach((enf,i)=>{
        if(!enf.naissance) return;
        const dateLimit=new Date(enf.naissance+"T00:00:00");
        dateLimit.setFullYear(dateLimit.getFullYear()+21);
        if(dateLimit>=today){
          auto.push({
            id:`enf_${m.id}_${i}`,auto:true,mid:m.id,nm,
            type:"Points enfants",
            label:`Fin points enfants — ${nm} (${enf.prenom||"enfant "+(i+1)})`,
            date:dateLimit.toISOString().split("T")[0],
            note:`${enf.prenom||"Enfant"} né(e) le ${fD(enf.naissance)}. Fin des 2 points supplémentaires à 21 ans.`,
          });
        }
      });
    }

    // Fin de période d'essai
    if(m.dateEssai){
      const fe=new Date(m.dateEssai+"T00:00:00");
      if(fe>=today){
        auto.push({
          id:`pe_${m.id}`,auto:true,mid:m.id,nm,
          type:"Période d'essai",
          label:`Fin période d'essai — ${nm}`,
          date:m.dateEssai,
          note:`Contrat signé le ${fD(m.dateEmbauche||m.dateEssai)}.`,
        });
      }
    }

    // Fin de contrat CDD
    if(m.dateFinContrat){
      const fc=new Date(m.dateFinContrat+"T00:00:00");
      if(fc>=today){
        auto.push({
          id:`fc_${m.id}`,auto:true,mid:m.id,nm,
          type:"Fin de contrat",
          label:`Fin de contrat — ${nm}`,
          date:m.dateFinContrat,
          note:`${m.typeContrat||"CDD"}.`,
        });
      }
    }
  });

  return[...auto,...auto_cp];
}

function rLOCATIONS(){

        return`<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;background:${enCours?"#FBF5E0":"#FAF7F0"};border:1px solid ${enCours?"#C8A84B":"#DDD5B8"};border-radius:9px;margin-bottom:6px;flex-wrap:wrap;gap:8px">

              ${enCours?`<span style="background:#C8A84B;color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;margin-right:6px">EN COURS</span>`:""}

            </div>
            <div style="font-size:13px;color:#555">📅 ${fD(l.debut)}${l.debut!==l.fin?" → "+fD(l.fin):""}

  const activeVeh=actives.filter(l=>l.type==="Véhicule");
  const passeeSite=passees.filter(l=>l.type!=="Véhicule");
  const passeeVeh=passees.filter(l=>l.type==="Véhicule");

  // Statut disponibilité minibus
  const mb1Occupe=activeVeh.some(l=>l.vehicule==="Minibus Ford"&&l.debut<=today&&l.fin>=today);

    </div>
    <div class="kpi" style="background:${mb2Occupe?"#FDECEA":"#E8F5EE"}">
      <div style="font-size:22px">🚌</div>
      <div style="font-size:14px;font-weight:800;color:${mb2Occupe?"#C0392B":"#2E7D52"}">Minibus Peugeot</div>

  const canPrint=canEdit||user?.id==="mfr015"; // Sandrine aussi
  return`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">

}

function bMdlNLoc(){
  const edit=A.s.modal.data.edit||null;
  let currentType=edit?.type||"Site";

  // Onglets Site / Véhicule / Prêt
  document.querySelectorAll("[data-loc-tab]").forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.locTab==="veh") currentType="Véhicule";
      else if(b.dataset.locTab==="pret") currentType="Prêt salarié";
      else currentType="Site";
      document.getElementById("loc-site-fields").style.display=currentType==="Site"?"block":"none";
      document.getElementById("loc-veh-fields").style.display=currentType==="Véhicule"?"block":"none";
      document.getElementById("loc-pret-fields").style.display=currentType==="Prêt salarié"?"block":"none";
      document.getElementById("loc-tab-site").className=`btn ${currentType==="Site"?"bp":"bl"} bsm`;
      document.getElementById("loc-tab-veh").className=`btn ${currentType==="Véhicule"?"bp":"bl"} bsm`;
      document.getElementById("loc-tab-pret").className=`btn ${currentType==="Prêt salarié"?"bp":"bl"} bsm`;
      // Afficher quota si salarié sélectionné
      const salEl=document.getElementById("loc-sal");
      if(salEl) salEl.onchange();
    };
  });

  // Vérification quota prêt salarié
  const salEl=document.getElementById("loc-sal");
  if(salEl) salEl.onchange=()=>{
    const mid=salEl.value;
    if(!mid) return;
    const annee=new Date().getFullYear();
    const dejaPretes=(A.s.locations||[]).filter(l=>
      l.type==="Prêt salarié"&&l.salMid===mid&&
      new Date(l.debut).getFullYear()===annee&&
      l.id!==(A.s.modal.data.edit?.id||"")
    );
    const info=document.getElementById("pret-quota-info");
    if(info){
      if(dejaPretes.length>=1){
        info.innerHTML=`<span style="color:#C0392B;font-weight:700">⚠️ Ce salarié a déjà bénéficié d'un prêt en ${annee} (${dejaPretes[0]?.pretBien||"—"} du ${fD(dejaPretes[0]?.debut)||"—"}). Autorisation direction requise.</span>`;
      } else {
        info.innerHTML=`<span style="color:#2E7D52;font-weight:700">✅ Quota disponible — 0/1 prêt utilisé en ${annee}</span>`;
      }
      info.style.display="block";
    }
  };

  document.getElementById("loc-cancel").onclick=()=>A.set({modal:null});
  document.getElementById("loc-submit").onclick=()=>{
    const who=document.getElementById("loc-who").value.trim();
    const deb=document.getElementById("loc-deb").value;
    const fin=document.getElementById("loc-fin").value;
    const cont=document.getElementById("loc-cont").value;
    const note=document.getElementById("loc-note").value;
    const montant=parseFloat(document.getElementById("loc-mt").value)||0;
    if(!who||!deb||!fin){alert("Renseignez le locataire, la date de début et la date de fin.");return;}
    if(fin<deb){alert("La date de fin doit être après la date de début.");return;}
    const isVeh=currentType==="Véhicule";
    const isPretSal=currentType==="Prêt salarié";
    const esp=isVeh||isPretSal?null:document.getElementById("loc-esp").value;
    const vehicule=isVeh?document.getElementById("loc-veh").value:null;
    const pretBien=isPretSal?document.getElementById("loc-pret-bien").value:null;
    const salMid=isPretSal?document.getElementById("loc-sal").value:null;
    const salMb=salMid?A.s.eq.find(m=>m.id===salMid):null;
    // Pour un prêt, le "locataire" = le salarié
    const whoFinal=isPretSal&&salMb?`${salMb.pr} ${salMb.nom}`:who;
    const user=A.s.user;
    const creePar=user?`${user.pr} ${user.nom}`:"Gabriel VICH";
    const entry={id:edit?.id||uid(),type:currentType,locataire:whoFinal,debut:deb,fin,
      espace:esp,vehicule,pretBien,salMid,contact:cont,note,montant,creePar,cr:today2()};
    const existing=A.s.locations||[];
    const l=edit?existing.map(x=>x.id===edit.id?entry:x):[...existing,entry];
    A.save("locations",l);
    A.set({modal:null});
    A.toast(`${edit?"Location modifiée":"Location enregistrée"} ✓ — visible par toute l'équipe`,"success");
  };
}


function rALERTES(){
  const {eq}=A.s;
  const all=getAllEcheances(eq);
  const filtre=A.s.alertFiltre||"all";

  // Compter par niveau
  const counts={rouge:0,orange:0,jaune:0,vert:0,dep:0};
  all.forEach(e=>{
    const al=getAlertLevel(e.date);
    if(al.diff<0) counts.dep++;
    else if(al.diff<=7) counts.rouge++;
    else if(al.diff<=30) counts.orange++;
    else if(al.diff<=90) counts.jaune++;
    else counts.vert++;
  });

  // KPIs
  let kpiH=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:14px">
    <div class="kpi" style="background:#FDECEA;cursor:pointer" data-alert-filtre="dep">

      <div style="font-size:12px;color:#555;font-weight:600">🚨 Dépassées</div></div>
    <div class="kpi" style="background:#FDECEA;cursor:pointer" data-alert-filtre="rouge">
      <div class="val" style="font-size:26px;font-weight:800;color:#C0392B">${counts.rouge}</div>
      <div style="font-size:12px;color:#555;font-weight:600">🔴 J-7</div></div>
    <div class="kpi" style="background:#FEF3E2;cursor:pointer" data-alert-filtre="orange">
      <div class="val" style="font-size:26px;font-weight:800;color:#B8670A">${counts.orange}</div>
      <div style="font-size:12px;color:#555;font-weight:600">🟠 J-30</div></div>
    <div class="kpi" style="background:#FBF5E0;cursor:pointer" data-alert-filtre="jaune">
      <div class="val" style="font-size:26px;font-weight:800;color:#C8A84B">${counts.jaune}</div>
      <div style="font-size:12px;color:#555;font-weight:600">🟡 J-90</div></div>
    <div class="kpi" style="background:#E8F5EE;cursor:pointer" data-alert-filtre="all">
      <div class="val" style="font-size:26px;font-weight:800;color:#2E7D52">${all.length}</div>
      <div style="font-size:12px;color:#555;font-weight:600">Toutes</div></div>
  </div>`;

  // Filtrer
  const vis=all.filter(e=>{
    const al=getAlertLevel(e.date);
    if(filtre==="dep")  return al.diff<0;
    if(filtre==="rouge")return al.diff>=0&&al.diff<=7;
    if(filtre==="orange")return al.diff>7&&al.diff<=30;
    if(filtre==="jaune")return al.diff>30&&al.diff<=90;
    return true;
  });

  // Liste
  let listeH="";
  if(!vis.length){
    listeH=`<div class="card" style="text-align:center;padding:40px"><p style="color:#888">Aucune échéance${filtre!=="all"?" dans cette plage":""}</p></div>`;
  } else {
    vis.forEach(e=>{
      const al=getAlertLevel(e.date);
      const tmeta=ECHEANCE_TYPES[e.type]||ECHEANCE_TYPES["Rappel libre"];
      const diffTxt=al.diff<0?`Dépassée de ${Math.abs(al.diff)} jour${Math.abs(al.diff)>1?"s":""}`:al.diff===0?"Aujourd'hui !":al.diff===1?"Demain":`Dans ${al.diff} jours`;

      listeH+=`<div class="card ca" style="border-left-color:${al.color};margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">

              <span style="font-weight:800;font-size:15px;color:#3A4425">${e.label}</span>
              <span style="background:${tmeta.bg};color:${tmeta.color};border:1.5px solid ${tmeta.color};border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700">${e.type}</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
              <span style="font-size:14px;color:#555">📅 ${fD(e.date)}</span>
              <span style="font-size:14px;font-weight:800;color:${al.color};background:${al.bg};border-radius:8px;padding:2px 10px">${al.label} — ${diffTxt}</span>
            </div>
            ${e.note?`<div style="font-size:13px;color:#888;margin-top:4px">💬 ${e.note}</div>`:""}
            ${e.auto?`<div style="font-size:11px;color:#AAA;margin-top:2px">⚡ Générée automatiquement</div>`:`<div style="font-size:11px;color:#AAA;margin-top:2px">✏️ Saisie manuellement${e.creePar?" par "+e.creePar:""}</div>`}
          </div>
          <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
            <button class="btn bl bsm" data-edit-ech="${e.id}">✏️</button>
            ${!e.auto?`<button class="btn bd bsm" data-del-ech="${e.id}">✕</button>`:""}
            ${e.auto&&e.type==="Visite médicale"?`<button class="btn bs bsm" data-maj-visite="${e.mid}">✓ MàJ visite</button><button class="btn bl bsm" data-mail-msa="${e.mid}" style="font-size:11px">✉️ Mail MSA</button>`:""}
          </div>
        </div>
      </div>`;
    });
  }

  return`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
    <h2 style="color:#3A4425;font-size:22px;font-weight:800">🔔 Échéancier & Alertes RH</h2>

  ${kpiH}
  ${filtre!=="all"?`<div style="margin-bottom:10px"><button class="btn bl bsm" data-alert-filtre="all">✕ Voir toutes les échéances</button></div>`:""}
  ${listeH}`;
}

function bMdlNEch(){

      id:edit?.id||uid(),
      type,label,mid:mid||null,nm:mb?`${mb.nom} ${mb.pr}`:"",

// ── Bandeau alertes pour le dashboard ───────────────────────────
function rBandeauAlertes(eq){
  const all=getAllEcheances(eq);
  const urgentes=all.filter(e=>{
    const al=getAlertLevel(e.date);
    return al.diff<=30;
  });
  if(!urgentes.length) return "";

  const dep=urgentes.filter(e=>getAlertLevel(e.date).diff<0).length;
  const j7=urgentes.filter(e=>{const d=getAlertLevel(e.date).diff;return d>=0&&d<=7;}).length;
  const j30=urgentes.filter(e=>{const d=getAlertLevel(e.date).diff;return d>7&&d<=30;}).length;

  return`<div style="background:#FDECEA;border:1.5px solid #E08080;border-radius:10px;padding:10px 14px;margin-bottom:12px;cursor:pointer" data-nav="al">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">🔔</span>
        <span style="font-size:14px;font-weight:700;color:#C0392B">${urgentes.length} échéance${urgentes.length>1?"s":""} à traiter</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${dep>0?`<span style="background:#C0392B;color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700">🚨 ${dep} dépassée${dep>1?"s":""}</span>`:""}
        ${j7>0?`<span style="background:#E08080;color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700">🔴 ${j7} avant J-7</span>`:""}
        ${j30>0?`<span style="background:#E8A030;color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700">🟠 ${j30} avant J-30</span>`:""}
      </div>
      <span style="font-size:13px;color:#C0392B;font-weight:600">Voir le détail →</span>
    </div>
    ${dep>0||j7>0?`<div style="margin-top:7px;display:flex;flex-wrap:wrap;gap:5px">
      ${urgentes.filter(e=>getAlertLevel(e.date).diff<=7).slice(0,3).map(e=>`<span style="background:#fff;border:1px solid #E08080;border-radius:6px;padding:2px 8px;font-size:12px;color:#C0392B">${ECHEANCE_TYPES[e.type]?.ic||"🔔"} ${e.label.substring(0,40)}${e.label.length>40?"…":""}</span>`).join("")}
    </div>`:""}
  </div>`;
}

function initFormations(){
  if(!A.s.formations) A.s.formations=[];

// Synthèse formations pour le rapport annuel
function synthFormations(annee){
  initFormations();
  const f=A.s.formations.filter(x=>x.annee===annee&&x.statut==="Réalisée");
  const totalHeures=f.reduce((s,x)=>s+(x.heures||0),0);
  const salariesFormes=[...new Set(f.map(x=>x.mid))];
  const totalSalaries=A.s.eq.filter(m=>!m.archive).length;
  const pct=totalSalaries>0?Math.round((salariesFormes.length/totalSalaries)*100):0;
  return{totalHeures,nbFormes:salariesFormes.length,totalSalaries,pct,formations:f};
}

// ══ SAUVEGARDE / RESTAURATION ════════════════════════════════════

function exporterDonnees(){
  const keys=["eq","abs","dem","heu","ord","fr","budgets","devis","echeances","locations","formations","affichage","maintenances"];
  const data={version:1,date:today2(),app:"MFR-RH",contenu:{}};
  keys.forEach(k=>{
    const v=A.s[k]||K.g(k);
    if(v) data.contenu[k]=v;
  });
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`MFR-RH_sauvegarde_${today2()}.json`;
  a.click();URL.revokeObjectURL(url);
  A.toast(`✓ Sauvegarde téléchargée — ${Math.round(json.length/1024)}Ko`,"success");
}

function restaurerDonnees(file){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.contenu||data.app!=="MFR-RH") throw new Error("Format invalide");
      if(!confirm(`Restaurer la sauvegarde du ${fD(data.date)} ?\n\nATTENTION : toutes les données actuelles seront remplacées.`)) return;
      Object.entries(data.contenu).forEach(([k,v])=>{K.s(k,v);A.s[k]=v;});
      A.toast(`✓ Données restaurées depuis la sauvegarde du ${fD(data.date)}`,"success");
      A.r();
    }catch(err){alert("Fichier invalide ou corrompu : "+err.message);}
  };
  reader.readAsText(file);
}

function bMdlNMaint(){
  const edit=A.s.modal.data.edit||null;
  let pj=[...(edit?.pj||[])];

  // Toggle dégradation
  const degCb=document.getElementById("mt-deg");
  const degFields=document.getElementById("mt-deg-fields");
  if(degCb) degCb.onchange=()=>{degFields.style.display=degCb.checked?"block":"none";};

  // Upload PJ
  const inp=document.getElementById("mt-pj-input");
  if(inp) inp.onchange=async(e)=>{
    const files=Array.from(e.target.files);
    for(const f of files){
      if(f.size>5*1024*1024){alert(`${f.name} trop volumineux.`);continue;}
      const data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);});
      pj.push({name:f.name,type:f.type,size:f.size,data});
    }
    const list=document.getElementById("mt-pj-list");
    if(list) list.innerHTML=pj.map((p,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 10px;background:#FAF7F0;border:1px solid #DDD;border-radius:8px;margin-bottom:4px">
      <span style="flex:1;font-size:13px">${p.name}</span>
      ${p.type&&p.type.startsWith("image/")?`<img src="${p.data}" style="width:38px;height:28px;object-fit:cover;border-radius:3px">`:"<span>📄</span>"}
      <button class="btn bd bsm" onclick="pj.splice(${i},1);this.closest('div').remove()">✕</button>
    </div>`).join("");
  };

  // Calcul coût en temps réel
  const updateCout=()=>{
    const interId=document.getElementById("mt-inter")?.value;
    const mb=interId?A.s.eq.find(m=>m.id===interId):null;
    const taux=mb?.tauxHoraire||25;
    const temps=parseFloat(document.getElementById("mt-tps")?.value)||0;
    const cout=parseFloat(document.getElementById("mt-cout")?.value)||0;
    const total=cout+(temps*taux);
    const preview=document.getElementById("mt-cout-preview");
    const val=document.getElementById("mt-cout-val");
    if(preview) preview.style.display=total>0?"block":"none";
    if(val) val.textContent=`${cout.toFixed(2)} € mat. + ${temps}h travaillées = ${total.toFixed(2)} € total estimé`; 
  };
  document.getElementById("mt-inter")?.addEventListener("change",updateCout);
  document.getElementById("mt-tps")?.addEventListener("input",updateCout);
  document.getElementById("mt-cout")?.addEventListener("input",updateCout);
  updateCout();

  document.getElementById("mt-cancel").onclick=()=>A.set({modal:null});
  document.getElementById("mt-submit").onclick=()=>{
    const intervenantId=document.getElementById("mt-inter")?.value||A.s.user?.id||"";
    const mbInter=A.s.eq.find(m=>m.id===intervenantId);
    const tauxHoraire=mbInter?.tauxHoraire||25;
    const intitule=document.getElementById("mt-int").value.trim();
    const type=document.getElementById("mt-type").value;
    const lieu=document.getElementById("mt-lieu").value;
    const date=document.getElementById("mt-dt").value;
    const temps=parseFloat(document.getElementById("mt-tps").value)||0;
    const coutMat=parseFloat(document.getElementById("mt-cout").value)||0;
    const statut=document.getElementById("mt-st").value;
    const description=document.getElementById("mt-desc").value;
    const degradation=document.getElementById("mt-deg").checked;
    const jeune=document.getElementById("mt-jeune")?.value||"";
    const famille=document.getElementById("mt-famille")?.value||"";
    const montantRefact=parseFloat(document.getElementById("mt-refact")?.value)||0;

    if(!intitule||!type||!lieu||!date){alert("Renseignez l'intitulé, le type, le lieu et la date.");return;}

    const coutTotal=coutMat+(temps*tauxHoraire);
    const u=A.s.user;
    const creePar=u?`${u.nom} ${u.pr}`:"Maintenance";
    const annee=getAS();
    const entry={id:edit?.id||uid(),cr:today2(),annee,intitule,type,lieu,date,
      temps,coutMat,coutTotal,tauxHoraire,
      intervenantId,intervenantNom:mbInter?`${mbInter.pr} ${mbInter.nom}`:"",
      statut,description,degradation,
      jeune:degradation?jeune:"",famille:degradation?famille:"",
      montantRefact:degradation?montantRefact:0,pj,creePar};

    const l=edit?(A.s.maintenances||[]).map(x=>x.id===edit.id?entry:x):[...(A.s.maintenances||[]),entry];
    A.save("maintenances",l);A.set({modal:null});
    A.toast(`Intervention ${edit?"modifiée":"enregistrée"} ✓`,"success");
  };
}

// ── Recharge automatique CP au 1er septembre ────────────────────
function rechargerCPAnnuels(){
  const today=new Date();
  const mm=today.getMonth()+1; // 1-12
  const dd=today.getDate();
  const yyyy=today.getFullYear();
  // Vérifier si on est entre le 1er et le 7 septembre (fenêtre de détection)
  if(mm!==9||dd>7) return;
  // Clé de la dernière recharge pour éviter de recharger 2 fois
  const cleRecharge=`cp_recharge_${yyyy}`;
  const dejaDone=K.g(cleRecharge);
  if(dejaDone) return;
  // Recharger les CP de chaque salarié actif
  const eq=A.s.eq||[];
  let nb=0;
  const newEq=eq.map(m=>{
    if(m.archive||!m.cpAnnuel) return m;
    nb++;
    // Reporter les CP non pris (dans la limite de 5j max selon CCN MFR)
    const soldeActuel=Math.max(0,(m.cp||0)-(m.cpp||0));
    const report=Math.min(5,soldeActuel); // report max 5j
    return{...m, cp:(m.cpAnnuel||25)+report, cpp:0};
  });
  if(nb>0){
    A.s.eq=newEq;
    K.s("eq",newEq);
    K.s(cleRecharge,{date:today.toISOString(),nb});
    console.log(`CP rechargés pour ${nb} salariés le 1er septembre ${yyyy}`);
    // Afficher une notification direction
    A.s._cpRechargeInfo={date:today.toISOString().split("T")[0],nb};
  }
}

function bBUDGET(){
  initBudgets();
  const annee=A.s.budAnneeSco||getAS();

  document.querySelectorAll("[data-bud-annee]").forEach(b=>{
    b.onclick=()=>{A.s.budAnneeSco=b.dataset.budAnnee;A.r();};
  });
  document.querySelectorAll("[data-bud-filter]").forEach(b=>{
    b.onclick=()=>{A.s.budFilter=b.dataset.budFilter;A.r();};
  });

  // Bouton nouveau devis
  const bnd=document.getElementById("btn-new-devis");
  if(bnd) bnd.onclick=()=>A.set({modal:{ty:"ndevis",data:{annee}}});

  // Bouton allouer budget
  document.querySelectorAll("[data-bud-allouer]").forEach(b=>{
    b.onclick=()=>{
      const entityId=b.dataset.budAllouer;
      const anneeD=b.dataset.budAnneeD;
      A.set({modal:{ty:"allocuer",data:{entityId,annee:anneeD}}});
    };
  });

  // Détail devis par entité
  document.querySelectorAll("[data-bud-detail]").forEach(b=>{
    b.onclick=()=>{
      const entityId=b.dataset.budDetail;
      const anneeD=b.dataset.budAnneeD;
      A.s.budFilter=null;
      A.set({modal:{ty:"detailBud",data:{entityId,annee:anneeD}}});
    };
  });

  // Valider/refuser devis
  document.querySelectorAll("[data-val-devis]").forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.valDevis;
      const st=b.dataset.vstDevis;
      const user=A.s.user;
      const now=new Date();
      const heure=`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
      const validePar=user?`${user.pr} ${user.nom}`:"Direction";

      // Refus : motif obligatoire
      if(st===ST_BUD.REF){
        const rep=prompt("Motif du refus (obligatoire) :");
        if(!rep) return;
        const list=(A.s.devis||[]).map(d=>d.id!==id?d:{...d,st,reponse:rep,dateValidation:today2(),heureValidation:heure,validePar});
        A.save("devis",list);
        A.toast("✗ Devis refusé","error");
        return;
      }

      // Paiement : demander date + mode de paiement
      if(st===ST_BUD.PAY){
        A.set({modal:{ty:"paiementDevis",data:{id,validePar}}});
        return;
      }

      // Accepter
      const list=(A.s.devis||[]).map(d=>d.id!==id?d:{...d,st,dateValidation:today2(),heureValidation:heure,validePar});
      A.save("devis",list);
      A.toast(`✓ Devis accepté — horodaté ${today2()} à ${heure}`,"success");
    };
  });

  // Prévisualisation PJ
  document.querySelectorAll("[data-preview-pj]").forEach(img=>{
    img.onclick=()=>{
      const w=window.open("","_blank","width=800,height=600");
      w.document.write(`<img src="${img.dataset.previewPj}" style="max-width:100%;max-height:100vh">`);
      w.document.close();
    };
  });
}

round:#EEF2E6;border-radius:5px;padding:2px 7px;font-size:11px;color:#3A4425;white-space:nowrap">📄 ${p.name.substring(0,15)}${p.name.length>15?"...":""}</span>`).join("")}</div>`:""}${(f.historique||[]).length>0?`<details style="margin-top:5px"><summary style="font-size:12px;color:#888;cursor:pointer">🕐 Historique (${f.historique.length})</summary><div style="background:#FAF7F0;border-radius:6px;padding:6px;margin-top:4px">${f.historique.map(h2=>`<div style="font-size:11px;color:#555;padding:2px 0">${fD(h2.date)} · <strong>${h2.user}</strong> → ${h2.action}</div>`).join("")}</div></details>`:""}</div><div style="display:flex;gap:6px;flex-wrap:wrap;flex-direction:column;align-items:flex-end"><button class="btn bl bsm" data-detail-fr="${f.id}">👁 Détail</button>${f.st==="Payée"||f.st===ST.APP||f.st==="Validée"||f.st==="Transmise Comptabilité"||f.st==="Validée Direction"?`<button class="btn bg bsm" data-pdf-fr="${f.id}">🖨 PDF</button>`:""} ${role==="direction"&&(f.st===ST.ATT||f.st==="Soumise"||f.st==="En attente Direction")?`<button class="btn bs bsm" data-val-fr="${f.id}" data-vst-fr="Validée Direction">✓ Valider</button><button class="btn bd bsm" data-val-fr="${f.id}" data-vst-fr="Refusée">✗ Refuser</button>`:""} ${role==="direction"&&(f.st==="Validée Direction"||f.st===ST.APP)?`<button class="btn" style="background:#F0E8F5;color:#6A2A8A;border:1.5px solid #A060C0;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600" data-val-fr="${f.id}" data-vst-fr="Transmise Comptabilité">📨 → Comptabilité</button>`:""} ${(f.mid==="mfr015"||f.mid==="mfr017"||role==="direction")&&f.st==="Transmise Comptabilité"?`<button class="btn bs bsm" data-pay-fr="${f.id}">💳 Payée</button>`:""} ${role==="direction"&&f.st==="Payée"?`<button class="btn bl bsm" data-arch-fr="${f.id}">📦 Archiver</button>`:""} ${(role==="salarie"&&f.st===ST.ATT||role==="salarie"&&f.st==="Soumise"||role==="salarie"&&f.st==="Brouillon")?`<button class="btn bw bsm" data-ann-fr="${f.id}">Annuler</button>`:"" function calcTotalFiche(f){
  const km=(f.lignesKm||[]).reduce((s,l)=>s+(l.km||0)*(l.ar?2:1)*TAUX_KM,0);
  const frais=(f.lignesFrais||[]).reduce((s,l)=>s+(parseFloat(l.montant)||0),0);
  return km+frais;
}

function bFR(){
  const b=document.getElementById("btn-new-fr");
  if(b) b.onclick=()=>{A.set({modal:{ty:"nf",data:{}}});};

  document.querySelectorAll("[data-detail-fr]").forEach(b=>{
    b.onclick=()=>{const f=A.s.fr?.find(x=>x.id===b.dataset.detailFr);if(f)A.set({modal:{ty:"df",data:{f}}});};
  });
  document.querySelectorAll("[data-pdf-fr]").forEach(b=>{
    b.onclick=()=>{const f=A.s.fr?.find(x=>x.id===b.dataset.pdfFr);if(f)pdfFrais(f);};
  });
  document.querySelectorAll("[data-val-fr]").forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.valFr,st=b.dataset.vstFr;
      const rep=st==="Refusée"||st===ST.REF?prompt("Motif du refus (optionnel) :"):"";
      const user=A.s.user?`${A.s.user.pr} ${A.s.user.nom}`:"Direction";
      const actionLabel={
        "Validée Direction":"Validée par la direction",
        "Refusée":"Refusée par la direction"+(rep?` : ${rep}`:""),
        "Transmise Comptabilité":"Transmise à la comptabilité (Sandrine GRODECOEUR + Gabriel VICH)",
        [ST.APP]:"Approuvée",[ST.REF]:"Refusée"
      }[st]||st;
      const list=(A.s.fr||[]).map(f=>{
        if(f.id!==id)return f;
        const hist=[...(f.historique||[]),{date:today2(),user,action:actionLabel}];
        return{...f,st,reponse:rep||"",dateValidation:today2(),historique:hist};
      });
      A.save("fr",list);
      const msgs={"Validée Direction":"✓ Fiche validée — en attente transmission comptabilité",
        "Refusée":"✗ Fiche refusée","Transmise Comptabilité":"📨 Transmis à Sandrine GRODECOEUR et Gabriel VICH ✓"};
      A.toast(msgs[st]||"Mis à jour",st==="Refusée"||st===ST.REF?"error":"success");
    };
  });
  document.querySelectorAll("[data-pay-fr]").forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.payFr;
      const f=(A.s.fr||[]).find(x=>x.id===id);
      if(!f)return;
      if(!confirm(`Confirmer le paiement de ${calcTotalFiche(f).toFixed(2)} € à ${f.nm} ?
Sandrine GRODECOEUR sera notifiée.`))return;
      const user=A.s.user?`${A.s.user.pr} ${A.s.user.nom}`:"Comptabilité";
      const hist=[...(f.historique||[]),{date:today2(),user,action:`Paiement de ${calcTotalFiche(f).toFixed(2)} € effectué`}];
      const list=(A.s.fr||[]).map(x=>x.id===id?{...x,st:"Payée",datePaiement:today2(),reponse:`Paiement effectué le ${fD(today2())} — mis en paiement par ${user}`,historique:hist}:x);
      A.save("fr",list);
      A.toast(`✅ Paiement de ${calcTotalFiche(f).toFixed(2)} € enregistré — ${f.nm} notifié(e) ✓`,"success");
    };
  });
  // Archivage
  document.querySelectorAll("[data-arch-fr]").forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.archFr;
      const f=(A.s.fr||[]).find(x=>x.id===id);
      if(!f)return;
      const user=A.s.user?`${A.s.user.pr} ${A.s.user.nom}`:"Direction";
      const hist=[...(f.historique||[]),{date:today2(),user,action:"Demande archivée"}];
      const list=(A.s.fr||[]).map(x=>x.id===id?{...x,st:"Archivée",historique:hist}:x);
      A.save("fr",list);A.toast("Fiche archivée 📦","success");
    };
  });
  // Filtres direction
  const ffs=document.getElementById("fr-fil-st");if(ffs)ffs.onchange=()=>{A.s.frFilSt=ffs.value;A.r();};
  const ffn=document.getElementById("fr-fil-nm");if(ffn)ffn.onchange=()=>{A.s.frFilNm=ffn.value;A.r();};
  // Brouillon
  const bbd=document.getElementById("btn-brouillon-fr");
  if(bbd)bbd.onclick=()=>A.set({modal:{ty:"nf",data:{brouillon:true}}});
  document.querySelectorAll("[data-ann-fr]").forEach(b=>{
    b.onclick=()=>{const list=(A.s.fr||[]).map(f=>f.id===b.dataset.annFr?{...f,st:ST.ANN}:f);A.save("fr",list);A.toast("Annulée","warn");};
  });
}

function bMdlNF(){
  const d=A.s.modal.data||{};
  let lignesKm=[...(d.lignesKm||[{depart:"MFR Barbaste",arrivee:"",km:0,ar:false}])];
  let lignesFrais=[...(d.lignesFrais||[])];
  let pj=[...(d.pj||[])];

  const calcTotal=()=>{
    const km=lignesKm.reduce((s,l)=>s+(l.km||0)*(l.ar?2:1)*TAUX_KM,0);
    const frais=lignesFrais.reduce((s,l)=>s+(parseFloat(l.montant)||0),0);
    const el=document.getElementById("fr-total-val");
    if(el) el.textContent=`${(km+frais).toFixed(2)} €`;
  };

  const syncKm=(i)=>{
    const dep=document.getElementById(`km-dep-${i}`)?.value||"";
    const arr=document.getElementById(`km-arr-${i}`)?.value||"";
    const ar=document.getElementById(`km-ar-${i}`)?.checked||false;
    const km=parseFloat(document.getElementById(`km-nb-${i}`)?.value)||0;
    if(lignesKm[i]){lignesKm[i].depart=dep;lignesKm[i].arrivee=arr;lignesKm[i].ar=ar;lignesKm[i].km=km;}
    // Mise à jour affichage montant en temps réel
    const montant=(km*(ar?2:1)*TAUX_KM).toFixed(2);
    const res=document.getElementById(`km-res-${i}`);
    const det=res?.nextElementSibling;
    if(res){res.textContent=km>0?montant+" €":"— €";res.style.color=km>0?"#2E7D52":"#888";}
    if(det){det.textContent=km>0?`${ar?km*2:km} km × 0,48 €`:"";}
    calcTotal();
  };
  const syncFrais=(i)=>{
    const ty=document.getElementById(`fr-ty-${i}`)?.value||"Autre";
    const ds=document.getElementById(`fr-ds-${i}`)?.value||"";
    const mt=document.getElementById(`fr-mt-${i}`)?.value||"0";
    if(lignesFrais[i]){lignesFrais[i].type=ty;lignesFrais[i].desc=ds;lignesFrais[i].montant=mt;}
    calcTotal();
  };

  
  const calcKm=async(i)=>{
    syncKm(i);
    const l=lignesKm[i];
    if(!l.depart||!l.arrivee){alert("Renseignez le lieu de départ et la destination.");return;}
    const res=document.getElementById(`km-res-${i}`);
    const btn=document.querySelector(`[data-calc-km="${i}"]`);
    if(res){res.textContent="⏳ Calcul en cours…";res.style.color="#888";}
    if(btn){btn.disabled=true;btn.textContent="⏳";}
    const result=await calcDistance(l.depart,l.arrivee);
    if(btn){btn.disabled=false;btn.textContent="🗺️ Calculer";}
    if(result.ok){
      lignesKm[i].km=result.km;
      const ar=document.getElementById(`km-ar-${i}`)?.checked||false;
      lignesKm[i].ar=ar;
      const total=(result.km*(ar?2:1)*TAUX_KM).toFixed(2);
      if(res){
        res.textContent=`✓ ${result.km} km${ar?" (×2 = "+(result.km*2)+" km)":""} → ${total} €`;
        res.style.color="#2E7D52";res.style.fontWeight="700";
      }
      calcTotal();
    } else {
      if(res){res.textContent=`⚠ ${result.error}`;res.style.color="#C0392B";}
      alert(`Calcul impossible.

${result.error}

Conseils :
• Saisissez : "Ville (47xxx)"
• Exemple : "Barbaste 47230" → "Agen 47000"`);
    }
  };
  // Calcul automatique à chaque saisie km
  document.querySelectorAll("[data-km-i]").forEach(inp=>{
    inp.oninput=()=>syncKm(parseInt(inp.dataset.kmI));
  });
  // AR checkbox
  document.querySelectorAll("[id^='km-ar-']").forEach(cb=>{
    cb.onchange=()=>{const i=parseInt(cb.id.split("-")[2]);syncKm(i);};
  });
  document.querySelectorAll("[data-rm-km]").forEach(b=>{b.onclick=()=>{lignesKm.splice(parseInt(b.dataset.rmKm),1);A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});};});
  document.querySelectorAll("[data-rm-fr]").forEach(b=>{b.onclick=()=>{lignesFrais.splice(parseInt(b.dataset.rmFr),1);A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});};});
  document.querySelectorAll("[data-rm-pj]").forEach(b=>{b.onclick=()=>{pj.splice(parseInt(b.dataset.rmPj),1);A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});};});

  document.querySelectorAll("[data-preview]").forEach(b=>{b.onclick=()=>{const p=pj[parseInt(b.dataset.preview)];if(p){const w=window.open();w.document.write(`<img src="${p.data}" style="max-width:100%">`);w.document.close();}};});

  
  document.querySelectorAll("[id^='km-ar-']").forEach(cb=>{cb.onchange=()=>{const i=parseInt(cb.id.split("-")[2]);syncKm(i);calcTotal();};});

  
  const bak=document.getElementById("fr-add-km");
  if(bak) bak.onclick=()=>{lignesKm.push({depart:"MFR Barbaste",arrivee:"",km:0,ar:false});A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});};

  
  const baf=document.getElementById("fr-add-frais");
  if(baf) baf.onclick=()=>{lignesFrais.push({type:"Repas",desc:"",montant:""});A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});};

  
  const inp=document.getElementById("fr-pj-input");
  if(inp) inp.onchange=async(e)=>{
    const files=Array.from(e.target.files);
    for(const f of files){
      if(f.size>5*1024*1024){alert(`${f.name} est trop volumineux (max 5 Mo).`);continue;}
      const data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);});
      pj.push({name:f.name,type:f.type,size:f.size,data});
    }
    A.set({modal:{ty:"nf",data:{lignesKm,lignesFrais,pj}}});
  };

  
  for(let i=0;i<lignesFrais.length;i++){
    ["ty","ds","mt"].forEach(p=>{const el=document.getElementById(`fr-${p}-${i}`);if(el)el.oninput=()=>syncFrais(i);});
  }

  calcTotal();

  document.getElementById("fr-cancel").onclick=()=>A.set({modal:null});
  // Bouton brouillon
  const bbrouil=document.getElementById("fr-brouillon");
  if(bbrouil)bbrouil.onclick=()=>{
    const ob=document.getElementById("fr-ob")?.value||"(sans titre)";
    const dt=document.getElementById("fr-dt")?.value||today2();
    const mb=A.s.eq.find(m=>m.id===A.s.user?.id);
    if(!mb)return;
    const fiche={id:uid(),cr:today2(),st:"Brouillon",mid:mb.id,nm:`${mb.nom} ${mb.pr}`,sv:mb.sv,em:mb.em||"",
      objet:ob,date:dt,lignesKm:[...lignesKm],lignesFrais:[...lignesFrais],pj:[...pj],
      commentaire:document.getElementById("fr-co")?.value||"",total:0,tauxKm:TAUX_KM,
      historique:[{date:today2(),user:`${mb.nom} ${mb.pr}`,action:"Brouillon créé"}]};
    A.save("fr",[...(A.s.fr||[]),fiche]);A.set({modal:null});
    A.toast("Brouillon sauvegardé 📝","success");
  };
  document.getElementById("fr-submit").onclick=()=>{
    const ob=document.getElementById("fr-ob").value;
    const dt=document.getElementById("fr-dt").value;
    const co=document.getElementById("fr-co").value;
    if(!ob||!dt){alert("Renseignez l'objet et la date.");return;}
    
    for(let i=0;i<lignesKm.length;i++) syncKm(i);
    for(let i=0;i<lignesFrais.length;i++) syncFrais(i);
    const mb=A.s.eq.find(m=>m.id===A.s.user?.id);
    const km=lignesKm.reduce((s,l)=>s+(l.km||0)*(l.ar?2:1)*TAUX_KM,0);
    const frais=lignesFrais.reduce((s,l)=>s+(parseFloat(l.montant)||0),0);
    const total=km+frais;
    const now=new Date();const horodatage=`${today2()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;const fiche={id:uid(),cr:today2(),horodatage,st:"En attente Direction",mid:mb.id,nm:`${mb.nom} ${mb.pr}`,sv:mb.sv,em:mb.em||"",
      objet:ob,date:dt,lignesKm,lignesFrais,pj,commentaire:co,total,tauxKm:TAUX_KM,
      historique:[{date:today2(),user:`${mb.nom} ${mb.pr}`,action:"Demande soumise à la direction"}]};
    A.save("fr",[...(A.s.fr||[]),fiche]);
    A.set({modal:null});
    A.toast("Fiche soumise ✓ — en attente de validation direction");
  };
}

  // Rendre les PDF en canvas via PDF.js
  const pjData = (f.pj||[]).filter(p=>!p.type||!p.type.startsWith("image/"));
  const renderPDFs = async () => {
    if(!pjData.length){w.print();return;}
    const pdfjsLib = w.pdfjsLib;
    if(!pdfjsLib){setTimeout(()=>w.print(),500);return;}
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    for(let i=0;i<pjData.length;i++){
      try{
        const data=atob(pjData[i].data.split(',')[1]);
        const arr=new Uint8Array(data.length);
        for(let j=0;j<data.length;j++) arr[j]=data.charCodeAt(j);
        const pdf=await pdfjsLib.getDocument({data:arr}).promise;
        const info=w.document.getElementById('pdf-info-'+i);
        if(info) info.textContent=pdf.numPages+' page'+(pdf.numPages>1?'s':'');
        for(let p=1;p<=Math.min(pdf.numPages,3);p++){
          const page=await pdf.getPage(p);
          const vp=page.getViewport({scale:1.2});
          const canvas=p===1?w.document.getElementById('pdf-canvas-'+i):w.document.createElement('canvas');
          if(p>1){canvas.style.cssText='max-width:100%;border:1px solid #EEE;border-radius:4px;display:block;margin-top:4px';w.document.getElementById('pdf-canvas-'+i).parentNode.appendChild(canvas);}
          canvas.width=vp.width;canvas.height=vp.height;
          await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
        }
      }catch(e){const el=w.document.getElementById('pdf-canvas-'+i);if(el)el.style.display='none';}
    }
    setTimeout(()=>w.print(),800);
  };
  setTimeout(()=>renderPDFs(),1000);
}

function bIM(){

function imprimerSalarie(mb, dd, df){
  const {abs,dem,heu,ord}=A.s;
  const cp=Math.max(0,(mb.cp||0)-(mb.cpp||0));

  document.querySelectorAll("[data-unarch]").forEach(b=>{b.onclick=()=>{const l=A.s.eq.map(m=>m.id===b.dataset.unarch?{...m,archive:false,dateArchive:null}:m);A.save("eq",l);A.toast("Membre réactivé ✓","success");};});

      const m=A.s.eq.find(x=>x.id===mid);

function bPR(){
  const blo=document.getElementById("btn-logout");
  if(blo)blo.onclick=()=>{A.s.role=null;A.s.user=null;K.s("ses",null);A.r();};
  const bp=document.getElementById("btn-purge");
  if(bp)bp.onclick=()=>{
    const cutoff=new Date();cutoff.setFullYear(cutoff.getFullYear()-5);
    const cutoffStr=cutoff.toISOString().split("T")[0];
    const toDelete=A.s.eq.filter(m=>m.archive&&m.dateArchive&&m.dateArchive<cutoffStr);
    if(!toDelete.length){alert("Aucune donnée à purger (membres archivés depuis > 5 ans).");return;}
    if(!confirm(`Purger définitivement ${toDelete.length} membre(s) archivé(s) depuis plus de 5 ans ?
Cette action est irréversible.`))return;
    const ids=new Set(toDelete.map(m=>m.id));
    const newEq=A.s.eq.filter(m=>!ids.has(m.id));
    const newAbs=A.s.abs.filter(a=>!ids.has(a.mid));
    const newDem=A.s.dem.filter(d=>!ids.has(d.mid));
    const newHeu=A.s.heu.filter(h=>!ids.has(h.mid));
    const newOrd=A.s.ord.filter(o=>!ids.has(o.mid));
    A.save("eq",newEq);A.save("abs",newAbs);A.save("dem",newDem);A.save("heu",newHeu);A.save("ord",newOrd);
    A.toast(`${toDelete.length} membre(s) purgé(s) ✓`,"success");
  };
}

function bLogin(){
  const eq=A.s.eq;
  document.getElementById("bd").onclick=()=>{
    document.getElementById("lc").innerHTML=`${fld("Votre identité",sel("who",ADM.map(a=>{const m=eq.find(e=>e.id===a.id);return{v:a.id,l:m?`${m.pr} ${m.nom}`:a.id}}),"","-- Choisir --"))}${fld("Mot de passe",`<div style="position:relative"><input type="password" id="pwd" placeholder="••••••••" style="padding-right:40px;width:100%"><button type="button" onclick="const i=document.getElementById('pwd');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈'" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;font-size:16px">👁</button></div>`)}<p id="lerr" style="color:#C0392B;font-size:16px;display:none">⚠ Identifiant ou mot de passe incorrect</p><button class="btn bp bfull" id="bld" style="margin-bottom:10px">Accéder →</button><button class="btn bl bfull bsm" id="brt">← Retour</button>`;
    document.getElementById("brt").onclick=()=>A.r();
    document.getElementById("bld").onclick=()=>{const who=document.getElementById("who").value,pwd=document.getElementById("pwd").value,adm=ADM.find(a=>a.id===who&&a.pwd===pwd);if(adm){const m=eq.find(e=>e.id===who)||{id:who,nom:"Direction",pr:""};A.s.role="direction";A.s.user=m;K.s("ses",{role:"direction",user:m});A.set({vue:"db"});}else document.getElementById("lerr").style.display="block";};
  };
  document.getElementById("bs").onclick=()=>{
    document.getElementById("lc").innerHTML=`${fld("Votre nom",sel("whs",sortEq(A.s.eq).map(m=>({v:m.id,l:`${m.nom} ${m.pr} — ${m.sv||""}`})),"","-- Sélectionner --"))}${fld("Mot de passe",`<div style="position:relative"><input type="password" id="pwdsal" placeholder="••••••••" style="padding-right:40px;width:100%"><button type="button" onclick="const i=document.getElementById('pwdsal');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈'" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;font-size:16px">👁</button></div>`)}<p id="lerr2" style="color:#C0392B;font-size:16px;display:none">⚠ Sélectionnez votre nom</p><button class="btn bp bfull" id="bls" style="margin-bottom:10px">Accéder →</button><button class="btn bl bfull bsm" id="brt2">← Retour</button>`;
    document.getElementById("brt2").onclick=()=>A.r();
    document.getElementById("bls").onclick=()=>{
    const who=document.getElementById("whs").value,pwd=document.getElementById("pwdsal").value;
    const m=A.s.eq.find(e=>e.id===who);
    if(!m){document.getElementById("lerr2").textContent="⚠ Sélectionnez votre nom";document.getElementById("lerr2").style.display="block";return;}
    
    const pwdAttendu=m.pw||PWDS_CLAIRS[who]||"";
    if(!pwdAttendu||pwd!==pwdAttendu){
      document.getElementById("lerr2").textContent="⚠ Mot de passe incorrect";
      document.getElementById("lerr2").style.display="block";return;
    }
    A.s.role="salarie";A.s.user=m;K.s("ses",{role:"salarie",user:m});A.set({vue:"db"});
};
  };
}


function rMain(){
  const {role,user,vue,toast,dem,ord}=A.s;
  const nAtt=dem.filter(d=>d.st===ST.ATT).length;
  const nOM=ord.filter(o=>o.st===ST.ATT).length;
  const nu=user?`${user.pr||""} ${user.nom||""}`.trim():"";
  const navItems=[
    {id:"db",ic:"🏠",lb:"Accueil"},
    {id:"rc",ic:"📋",lb:"Équipe"},
    {id:"dm",ic:"📨",lb:"Demandes",bdg:role==="direction"?nAtt:0},
    {id:"ab",ic:"📅",lb:"Absences"},
    
    {id:"hr",ic:"⏱",lb:"Heures"},
    {id:"om",ic:"🗺️",lb:"Missions"},
    {id:"fr",ic:"💶",lb:"Frais"},{id:"bu",ic:"💰",lb:"Budget"},{id:"al",ic:"🔔",lb:"Alertes"},...(canSeeSynth(role,user?.id)?[{id:"sy",ic:"📊",lb:"Bilan RH"}]:[]),{id:"lo",ic:"🏠",lb:"Locations"},{id:"fo",ic:"🎓",lb:"Formations"},{id:"af",ic:"📋",lb:"Affichage"},...(canSeeMaint(role,user?.id)?[{id:"mt",ic:"🔧",lb:"Entretien"}]:[]),
    ...(role==="direction"?[{id:"pc",ic:"🎓",lb:"Classes"},{id:"fi",ic:"📚",lb:"Filières"},{id:"im",ic:"🖨️",lb:"Imprimer"},{id:"eq",ic:"👥",lb:"Équipe"},{id:"pr",ic:"⚙️",lb:"Réglages"}]:[])
  ];
  const nav=navItems.map(n=>`<button class="nb${vue===n.id?" on":""}" data-v="${n.id}"><span class="ic">${n.ic}</span><span class="lb">${n.lb}</span>${n.bdg>0?`<span class="bdg">${n.bdg}</span>`:""}</button>`).join("");
  let content="";
  if(vue==="db")content=rDB();
  else if(vue==="rc")content=rRCPL();
  else if(vue==="dm")content=rDM();
  else if(vue==="ab")content=rAB();
  else if(vue==="hr")content=rHR();
  else if(vue==="om")content=rOM();
  else if(vue==="fr")content=rFR();
  else if(vue==="bu")content=rBUDGET();
  else if(vue==="al")content=rALERTES();
  else if(vue==="sy")content=rSYNTHESE();
  else if(vue==="lo")content=rLOCATIONS();
  else if(vue==="fo")content=rFORMATIONS();
  else if(vue==="af")content=rAFFICHAGE();
  else if(vue==="mt")content=rMAINTENANCE();
  else if(vue==="pc")content=rPLANNING_CLASSES();
  else if(vue==="fi"&&role==="direction")content=rFILIERES();
  else if(vue==="im"&&role==="direction")content=rIM();
  else if(vue==="eq"&&role==="direction")content=rEQ();
  else if(vue==="pr"&&role==="direction")content=rPR();
  const tst=toast?`<div class="tst" style="background:${{success:"#2E7D52",error:"#C0392B",info:"#1A6B9A",warn:"#B8670A"}[toast.ty]||"#5C6B3A"}">${toast.msg}</div>`:"";
