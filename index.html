function rRCPL(){
  const {eq,abs,dem,role,user}=A.s;
  const ms=getMC();
  const onglet=A.s.rcplOnglet||"soldes";
  const tabs=`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <button class="btn ${onglet==="soldes"?"bp":"bl"} bsm" data-rcpl-tab="soldes">📋 Soldes équipe</button>
    <button class="btn ${onglet==="planning"?"bp":"bl"} bsm" data-rcpl-tab="planning">📅 Planning absences</button>
  </div>`;

  if(onglet==="soldes"){
    // ── Vue Soldes — direction uniquement ──
    if(role!=="direction"){
      return`<h2 style="color:#3A4425;font-size:22px;font-weight:800;margin-bottom:14px">📋 Équipe — Récap & Planning</h2>
        ${tabs}
        <div class="wbox">🔒 Les soldes individuels (congés payés, récupération) sont réservés à la direction.</div>`;
    }
    const[y,mo]=ms.split("-").map(Number);
    const dernJ=new Date(y,mo,0);let jo=0;
    for(let d=new Date(y,mo-1,1);d<=dernJ;d.setDate(d.getDate()+1)){if(d.getDay()!==0&&d.getDay()!==6)jo++;}
    const dM=`${ms}-01`,fM=`${ms}-${String(dernJ.getDate()).padStart(2,"0")}`;
    const actifs=sortEq(eq.filter(m=>!m.archive));
    let rows="";
    actifs.forEach(m=>{
      const cp=Math.max(0,(m.cp||0)-(m.cpp||0));
      const ra=Math.max(0,(m.ra||0)-(m.rp||0));
      let absM=0;
      abs.forEach(a=>{
        if(a.mid!==m.id||a.ty==="Annulée")return;
        const db=a.dd>dM?a.dd:dM;const fi=(a.df||a.dd)<fM?(a.df||a.dd):fM;
        if(db<=fi)absM+=nJO(db,fi,a.cj||1);
      });
      const pres=jo>0?Math.round(((jo-absM)/jo)*100):100;
      const sc=getSeuilColor(pres);
      rows+=`<tr>
        <td style="padding:7px 12px;font-weight:700">${m.nom} ${m.pr}</td>
        <td style="padding:7px 8px"><span class="tsv">${m.sv||""}</span></td>
        <td style="padding:7px 8px;text-align:center;font-weight:700;color:#C8A84B">${cp}<span style="font-size:11px;color:#888">j</span></td>
        <td style="padding:7px 8px;text-align:center;font-weight:700;color:#5C6B3A">${fH(ra*7)}</td>
        <td style="padding:7px 8px">
          <div style="display:flex;align-items:center;gap:6px">
            <div style="flex:1;height:8px;background:#EDE8D8;border-radius:4px;min-width:50px">
              <div style="width:${Math.min(100,pres)}%;height:100%;background:${sc.c};border-radius:4px"></div>
            </div>
            <span style="font-size:12px;font-weight:700;color:${sc.c}">${pres}%</span>
          </div>
        </td>
        <td style="padding:7px 8px;text-align:center">${absM>0?`<span style="background:#FDECEA;color:#C0392B;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700">${absM}j</span>`:"—"}</td>
      </tr>`;
    });
    return`<h2 style="color:#3A4425;font-size:22px;font-weight:800;margin-bottom:14px">📋 Équipe — Récap & Planning</h2>
      ${tabs}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <span style="font-size:14px;color:#555">Soldes et présence — <strong>${MNS[mo-1]} ${y}</strong></span>
        <div style="display:flex;gap:6px">
          <button class="btn bl bsm" id="rc-prev">←</button>
          <button class="btn bl bsm" id="rc-next">→</button>

      </div>
      <div style="overflow-x:auto;border-radius:12px;border:1px solid #DDD5B8;background:#fff">
        <table style="border-collapse:collapse;min-width:100%;font-size:14px">
          <thead><tr style="background:#3A4425">
            <th style="padding:9px 12px;color:#fff;text-align:left">Membre</th>
            <th style="padding:9px 8px;color:#fff">Service</th>
            <th style="padding:9px 8px;color:#fff;text-align:center">CP restants</th>
            <th style="padding:9px 8px;color:#fff;text-align:center">Récup</th>
            <th style="padding:9px 8px;color:#fff;min-width:120px">Présence mois</th>
            <th style="padding:9px 8px;color:#fff;text-align:center">Abs. mois</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  // ── Vue Planning (ancien rPL) ──
  const mo=A.s.pMo||new Date().getMonth();
  const an=A.s.pAn||new Date().getFullYear();
  const pJ=new Date(an,mo,1),dJ=new Date(an,mo+1,0);
  const nbJ=dJ.getDate();
  const actifs=sortEq(eq.filter(m=>!m.archive));
  // En-tête jours
  let headCols="";
  for(let d=1;d<=nbJ;d++){

function bRCPL(){
  // Onglets
  document.querySelectorAll("[data-rcpl-tab]").forEach(b=>{
    b.onclick=()=>{A.s.rcplOnglet=b.dataset.rcplTab;A.r();};
  });
  // Navigation soldes
  const rprev=document.getElementById("rc-prev");
  if(rprev) rprev.onclick=()=>{
    let [y,mo]=getMC().split("-").map(Number);mo--;if(mo<1){mo=12;y--;}
    A.s.mcSel=`${y}-${String(mo).padStart(2,"0")}`;A.r();
  };
  const rnext=document.getElementById("rc-next");
  if(rnext) rnext.onclick=()=>{
    let [y,mo]=getMC().split("-").map(Number);mo++;if(mo>12){mo=1;y++;}
    A.s.mcSel=`${y}-${String(mo).padStart(2,"0")}`;A.r();
  };
  const rnow=document.getElementById("rc-now");
  if(rnow) rnow.onclick=()=>{A.s.mcSel=null;A.r();};
  // Navigation planning
  const pprev=document.getElementById("pl-prev");
  if(pprev) pprev.onclick=()=>{
    let mo=A.s.pMo!==undefined?A.s.pMo:new Date().getMonth();
    let an=A.s.pAn||new Date().getFullYear();
    mo--;if(mo<0){mo=11;an--;}
    A.s.pMo=mo;A.s.pAn=an;A.r();
  };
  const pnext=document.getElementById("pl-next");
  if(pnext) pnext.onclick=()=>{
    let mo=A.s.pMo!==undefined?A.s.pMo:new Date().getMonth();
    let an=A.s.pAn||new Date().getFullYear();
    mo++;if(mo>11){mo=0;an++;}
    A.s.pMo=mo;A.s.pAn=an;A.r();
  };
  const pnow=document.getElementById("pl-now");
  if(pnow) pnow.onclick=()=>{A.s.pMo=undefined;A.s.pAn=undefined;A.r();};
}

              const c=j.dep>0?(j.st===ST.APP?"#2E7D52":j.st===ST.REF?"#C0392B":j.st===ST.ATT?"#B8670A":"#888"):j.veillee?"#7050B0":j.svcMidi||j.svcSoir?"#A060C0":"#5C6B3A";
              const extras=(j.svcMidi?"🍽️":"")+(j.svcSoir?"🌆":"")+(j.veillee?"🌙":"");
              return`<span style="font-size:11px;background:#F5F5F5;border:1px solid #DDD;border-radius:6px;padding:2px 8px;color:${c}">${["D","L","M","M","J","V","S"][new Date(j.dt+"T12:00:00").getDay()]}${extras} ${j.dep>0?`+${fH(j.dep)}`:fH(j.hr)}</span>`;
            }).join("")}
          </div>
        </div>
        ${hasAtt?`<div style="display:flex;flex-direction:column;gap:5px">
          <button class="btn bs bsm" data-val-sem="${sem.mid}_${sem.lun}">✓ Valider récup</button>
          <button class="btn bd bsm" data-ref-sem="${sem.mid}_${sem.lun}">✗ Refuser</button>
        </div>`:""}
      </div>
    </div>`;
  });

  return`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
    <h2 style="color:#3A4425;font-size:22px;font-weight:800">⏱ Déclarations horaires</h2>
    ${enAH>0?`<span style="background:#FEF3E2;color:#B8670A;border:1.5px solid #E8A030;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700">${enAH} dépassement${enAH>1?"s":""} à valider</span>`:""}
  </div>${lH}`;
}

function bHR(){
  const pv=document.getElementById("hpv");
  if(pv)pv.onclick=()=>{const d=new Date(hLun+"T12:00:00");d.setDate(d.getDate()-7);hLun=d.toISOString().split("T")[0];A.r();};
  const nx=document.getElementById("hnx");
  if(nx)nx.onclick=()=>{const d=new Date(hLun+"T12:00:00");d.setDate(d.getDate()+7);hLun=d.toISOString().split("T")[0];A.r();};

  const mb=A.s.eq.find(m=>m.id===A.s.user?.id);

  
  document.querySelectorAll("[data-conf]").forEach(b=>{
    b.onclick=()=>{
      const jk=b.dataset.conf,ds=b.dataset.cds;if(!mb)return;
      const ht=gHT(mb.id,jk);const jT=HOR[mb.id]?.j[jk];if(!jT)return;
      const e={id:uid(),mid:mb.id,nm:`${mb.nom} ${mb.pr}`,sv:mb.sv,dt:ds,jk,
        hd:jT[0]||"",hf:jT[3]||jT[1]||"",ht,hr:ht,dep:0,rc:0,mo:"",
        st:ST.APP,cr:today2(),lun:hLun,conf:true,svcMidi:false,svcSoir:false,veillee:false};
      const l=[...A.s.heu.filter(x=>!(x.mid===mb.id&&x.dt===ds)),e];
      A.save("heu",l);A.toast("Journée confirmée ✓","success");
    };
  });

  
  const bvs=document.getElementById("btn-val-sem");
  if(bvs&&mb){
    bvs.onclick=()=>{
      const prof=HOR[mb.id];let newH=[...A.s.heu];
      JK.forEach(jk=>{
        const ds=getDJ(hLun,jk);if(ds>today2())return;
        const jT=prof?.j[jk];if(!jT)return;
        if(newH.find(x=>x.mid===mb.id&&x.dt===ds))return;
        const ht=gHT(mb.id,jk);
        const e={id:uid(),mid:mb.id,nm:`${mb.nom} ${mb.pr}`,sv:mb.sv,dt:ds,jk,
          hd:jT[0]||"",hf:jT[3]||jT[1]||"",ht,hr:ht,dep:0,rc:0,mo:"",
          st:ST.APP,cr:today2(),lun:hLun,conf:true,svcMidi:false,svcSoir:false,veillee:false};
        newH=[...newH.filter(x=>!(x.mid===mb.id&&x.dt===ds)),e];
      });
      A.save("heu",newH);A.toast("Semaine confirmée ✓","success");
    };
  }

  
  document.querySelectorAll("[data-svc]").forEach(b=>{
    b.onclick=()=>{
      if(!mb)return;
      const jk=b.dataset.svc,ds=b.dataset.sds,stype=b.dataset.stype;
      const cr=CRENEAUX_SPECIAUX[stype];
      const jT=HOR[mb.id]?.j[jk];
      const ht=cr.remplace?cr.duree:gHT(mb.id,jk);
      
      const existing=A.s.heu.find(x=>x.mid===mb.id&&x.dt===ds);
      if(existing){
        
        const updated={...existing,[stype==="veillee"?"veillee":stype==="svc_midi"?"svcMidi":"svcSoir"]:true};
        if(cr.remplace){updated.hd="13:30";updated.hf="21:00";updated.hr=cr.duree;updated.ht=ht;}
        const l=[...A.s.heu.filter(x=>!(x.mid===mb.id&&x.dt===ds)),updated];
        A.save("heu",l);
      } else {
        
        const hd=cr.remplace?"13:30":(jT?jT[0]||"":"08:00");
        const hf=cr.remplace?"21:00":(jT?jT[3]||jT[1]||"":"17:30");
        const e={id:uid(),mid:mb.id,nm:`${mb.nom} ${mb.pr}`,sv:mb.sv,dt:ds,jk,
          hd,hf,ht,hr:cr.remplace?cr.duree:gHT(mb.id,jk),dep:0,rc:0,mo:"",
          st:ST.APP,cr:today2(),lun:hLun,conf:true,
          svcMidi:stype==="svc_midi",svcSoir:stype==="svc_soir",veillee:cr.remplace};
        const l=[...A.s.heu.filter(x=>!(x.mid===mb.id&&x.dt===ds)),e];
        A.save("heu",l);
      }
      A.toast(`${cr.emoji} ${cr.label} enregistré ✓`,"success");
    };
  });

  
  document.querySelectorAll("[data-add-svc]").forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.addSvc,field=b.dataset.addType;
      const l=A.s.heu.map(x=>x.id===id?{...x,[field]:true}:x);
      A.save("heu",l);A.toast("Service ajouté ✓","success");
    };
  });

  
  document.querySelectorAll("[data-rm-svc]").forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.rmSvc,field=b.dataset.rmType;
      const l=A.s.heu.map(x=>x.id===id?{...x,[field]:false}:x);
      A.save("heu",l);A.toast("Service retiré","warn");
    };
  });

  
  document.querySelectorAll("[data-dpj]").forEach(b=>{
    b.onclick=()=>{
      if(!mb)return;
      const jk=b.dataset.dpj,ds=b.dataset.dpd;
      const jT=HOR[mb.id]?.j[jk];
      A.set({modal:{ty:"dp",data:{mb,jk,ds,jT,ht:gHT(mb.id,jk),isDim:new Date(ds+"T12:00:00").getDay()===0}}});
    };
  });

  
  document.querySelectorAll("[data-anh]").forEach(b=>{
    b.onclick=()=>{const l=A.s.heu.filter(h=>h.id!==b.dataset.anh);A.save("heu",l);A.toast("Déclaration annulée","warn");};
  });

  
  document.querySelectorAll("[data-val-sem]").forEach(b=>{
    b.onclick=()=>{
      const[mid,lun]=b.dataset.valSem.split("_");
      let neq=[...A.s.eq];
      const l=A.s.heu.map(x=>{
        if(x.mid!==mid||x.lun!==lun||x.st!==ST.ATT||x.dep<=0)return x;
        neq=neq.map(m=>{if(m.id!==mid)return m;return{...m,ra:(m.ra||0)+(x.rc||0)/7};});
        return{...x,st:ST.APP};
      });
      K.s("eq",neq);A.s.eq=neq;
      A.save("heu",l);A.toast("Récupérations créditées ✓","success");
    };
  });
  document.querySelectorAll("[data-ref-sem]").forEach(b=>{
    b.onclick=()=>{
      const[mid,lun]=b.dataset.refSem.split("_");
      const l=A.s.heu.map(x=>x.mid===mid&&x.lun===lun&&x.st===ST.ATT&&x.dep>0?{...x,st:ST.REF}:x);
      A.save("heu",l);A.toast("Dépassements refusés","error");
    };
  });
}


function rMdlDP(){
  const {mb,jk,ds,jT,ht,isDim}=A.s.modal.data;
  const coef=isDim?1.5:1.0;
  
  const pauseDeb=jT?jT[1]||"":""
  const pauseFin=jT?jT[2]||"":""
  return mdl(isDim?"🌞 Déclarer des heures dimanche":"⏱ Rectification d'horaire",`
    ${!isDim?`<div class="wbox">⚠️ Toute heure supplémentaire doit être validée en amont par la direction sauf urgence.</div>`:""}
    ${isDim?`<div style="background:#FEF3E2;border:1.5px solid #E8A030;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px;color:#7A4A00;font-weight:600">🌞 Heures travaillées le dimanche — récupérées à <strong>×1,5</strong> après validation direction.</div>`:""}
    <div style="background:#FAF7F0;border:1px solid #DDD5B8;border-radius:9px;padding:10px 14px;margin-bottom:12px">
      <div style="font-weight:700;font-size:15px">${JL[jk]} ${fD(ds)}</div>
      ${ht>0?`<div style="font-size:13px;color:#555;margin-top:2px">Horaire théorique : ${fH(ht)}</div>`:""}
    </div>

    <p style="font-size:13px;font-weight:700;color:#3A4425;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">🌅 Matin</p>
    <div class="g2">
      ${fld("Début de journée",`<input type="time" id="dphd" value="${jT?jT[0]||"":""}">`)}
      ${fld("Fin de matinée",`<input type="time" id="dpfm" value="${pauseDeb}">`)}
    </div>

    <p style="font-size:13px;font-weight:700;color:#3A4425;text-transform:uppercase;letter-spacing:.5px;margin:8px 0">☀️ Pause méridienne</p>
    <div class="g2">
      ${fld("Début de pause",`<input type="time" id="dpdp" value="${pauseDeb}" placeholder="ex: 12:00">`)}
      ${fld("Fin de pause",`<input type="time" id="dpfp" value="${pauseFin}" placeholder="ex: 13:30">`)}
    </div>
    <div id="pause-info" style="font-size:13px;color:#888;margin-bottom:8px"></div>

    <p style="font-size:13px;font-weight:700;color:#3A4425;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">🌇 Après-midi</p>
    <div class="g2">
      ${fld("Reprise après-midi",`<input type="time" id="dpda" value="${pauseFin}">`)}
      ${fld("Fin de journée",`<input type="time" id="dphf" value="${jT?jT[3]||jT[1]||"":""}">`)}
    </div>

    <div id="dpnfo" style="background:#E8F5EE;border-radius:8px;padding:10px 14px;font-size:14px;color:#2E7D52;font-weight:600;margin-bottom:10px;display:none"></div>

    ${fld("Motif (obligatoire)",'<textarea id="dpmo" rows="2" placeholder="Décrivez la raison du dépassement ou de la modification…"></textarea>',"Obligatoire pour tout dépassement")}
    <div class="dvd"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn bl" id="dpcn">Annuler</button>
      <button class="btn bw" id="dpsb">Envoyer la déclaration</button>
    </div>`);
}
function bMdlDP(){
  const {mb,jk,ds,ht,isDim}=A.s.modal.data;
  const coef=isDim?1.5:1.0;

  
  const calcTotal=()=>{
    const hd=document.getElementById("dphd").value;   
    const fm=document.getElementById("dpfm").value;   
    const dp=document.getElementById("dpdp").value;   
    const fp=document.getElementById("dpfp").value;   
    const da=document.getElementById("dpda").value;   
    const hf=document.getElementById("dphf").value;   
    
    const pauseDuree=dp&&fp?cH(dp,fp):0;
    
    const pi=document.getElementById("pause-info");
    if(pi&&dp&&fp) pi.textContent=`Pause méridienne : ${fH(pauseDuree)} (${dp} → ${fp})`;
    else if(pi) pi.textContent="";
    
    if(!hd||!hf) return{r:0,dep:0,rc:0,pauseDuree,hd,hf,fm,dp,fp,da};
    const brut=cH(hd,hf);
    const r=Math.max(0,brut-pauseDuree);
    const dep=Math.max(0,r-ht);
    const rc=dep*coef;
    const nfo=document.getElementById("dpnfo");
    if(nfo){
      nfo.style.display="block";
      nfo.innerHTML=`Temps réel : <strong>${fH(r)}</strong>${pauseDuree>0?` (pause ${fH(pauseDuree)} déduite)`:""}${dep>0?` · Dépassement : <strong style="color:#B8670A">+${fH(dep)}</strong> · Récup : <strong>${fH(rc)}</strong>${isDim?" (×1,5)":""}`:` · <span style="color:#2E7D52">Conforme</span>`}`;
    }
    return{r,dep,rc,pauseDuree,hd,hf,fm,dp,fp,da};
  };

  ["dphd","dpfm","dpdp","dpfp","dpda","dphf"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.oninput=calcTotal;
  });
  calcTotal();

  document.getElementById("dpcn").onclick=()=>A.set({modal:null});
  document.getElementById("dpsb").onclick=()=>{
    const mo=document.getElementById("dpmo").value;
    const {r,dep,rc,pauseDuree,hd,hf,fm,dp,fp,da}=calcTotal();
    if(!hd||!hf||(!mo&&dep>0)){
      if(!mo&&dep>0){alert("Le motif est obligatoire pour tout dépassement.");return;}
      if(!hd||!hf){alert("Renseignez au minimum l'heure de début et de fin.");return;}
    }
    const e={id:uid(),mid:mb.id,nm:`${mb.nom} ${mb.pr}`,sv:mb.sv,dt:ds,jk,
      hd,hf,fm:fm||"",dp:dp||"",fp:fp||"",da:da||"",
      pauseDuree,ht,hr:r,dep,rc,coef,mo:mo||"",isDim:isDim||false,
      st:dep>0?ST.ATT:ST.APP,cr:today2(),lun:hLun,
      svcMidi:false,svcSoir:false,veillee:false};
    const l=[...A.s.heu.filter(x=>!(x.mid===mb.id&&x.dt===ds)),e];
    A.save("heu",l);A.set({modal:null});
    if(dep>0) A.toast("Déclaration envoyée ✓ — dépassement en attente de validation");
    else A.toast("Horaires enregistrés ✓","success");
  };
}
